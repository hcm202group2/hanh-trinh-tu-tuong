<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hành Trình Tư Tưởng</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:radial-gradient(circle at center,#351414 0%,#150909 55%,#070404 100%);
  color:#f3eadb;
  min-height:100vh;
}

#game{
  min-height:100vh;
  position:relative;
  overflow:hidden;
}

.noise{
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.07;
  background-image:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(255,255,255,.05) 3px
  );
}

.screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:90px 24px 60px;
  animation:appear .8s ease;
}

.content{
  width:min(950px,100%);
}

.small{
  letter-spacing:6px;
  font-size:13px;
  color:#c8a45c;
  margin-bottom:22px;
}

h1{
  font-size:clamp(45px,8vw,90px);
  line-height:.95;
  margin-bottom:25px;
}

.red{color:#b83b38}
.gold{color:#c8a45c}

.subtitle{
  max-width:700px;
  margin:0 auto 35px;
  color:#c8beb1;
  font-size:18px;
  line-height:1.7;
}

.btn{
  border:1px solid #c8a45c;
  background:transparent;
  color:#f5ead5;
  padding:16px 30px;
  font-size:14px;
  letter-spacing:2px;
  cursor:pointer;
  transition:.25s;
}

.btn:hover{
  background:#c8a45c;
  color:#160909;
  transform:translateY(-3px);
}

/* HUD */
#hud{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  padding:18px 28px;
  display:none;
  justify-content:space-between;
  align-items:center;
  z-index:20;
  background:rgba(8,4,4,.8);
  border-bottom:1px solid rgba(200,164,92,.25);
  backdrop-filter:blur(8px);
}

.hudBlock{
  font-size:13px;
  letter-spacing:2px;
}

#hearts{color:#d95550;font-size:20px}

.progressWrap{
  width:180px;
  height:5px;
  background:#332727;
  margin-top:8px;
}

#progress{
  width:20%;
  height:100%;
  background:#c8a45c;
}

/* LEVEL 1 */
.levelTitle{
  font-size:clamp(32px,6vw,65px);
  margin-bottom:10px;
}

.mission{
  color:#c8a45c;
  letter-spacing:3px;
  font-size:13px;
  margin-bottom:12px;
}

.objects{
  margin:38px auto 25px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  max-width:760px;
}

.object{
  min-height:145px;
  border:1px solid rgba(200,164,92,.25);
  background:rgba(255,255,255,.035);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.25s;
  padding:18px;
}

.object:hover{
  transform:translateY(-6px);
  border-color:#c8a45c;
  background:rgba(200,164,92,.08);
}

.object .icon{
  font-size:48px;
  margin-bottom:12px;
}

.object .label{
  font-size:12px;
  letter-spacing:2px;
  color:#a99f91;
}

.object.correct-found{
  border-color:#7aaa72;
  background:rgba(70,120,60,.12);
  opacity:.55;
  pointer-events:none;
}

.object.wrong{
  animation:shake .35s;
  border-color:#b83b38;
}

#message{
  min-height:35px;
  margin-top:20px;
  font-size:15px;
  letter-spacing:1px;
  color:#d8c9b4;
}

.completeBox{
  padding:45px 25px;
  border:1px solid rgba(200,164,92,.4);
  background:rgba(255,255,255,.025);
  max-width:700px;
  margin:auto;
}

.scoreBig{
  font-size:70px;
  color:#c8a45c;
  margin:15px 0;
  font-weight:bold;
}

@keyframes appear{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-8px)}
  75%{transform:translateX(8px)}
}
/* ===== CINEMATIC 1911 → 1920 ===== */

.cinematic{
  position:relative;
  width:min(1000px,100%);
  min-height:520px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  overflow:hidden;
}

.cineTitle{
  font-size:13px;
  letter-spacing:7px;
  color:#c8a45c;
  margin-bottom:45px;
}

.timelineScene{
  position:relative;
  width:85%;
  max-width:850px;
  height:180px;
  margin:auto;
}

.timelineBase{
  position:absolute;
  left:0;
  right:0;
  top:90px;
  height:2px;
  background:#352929;
}

.timelineFill{
  position:absolute;
  left:0;
  top:90px;
  height:2px;
  width:0;
  background:#c8a45c;
  animation:growTimeline 5.5s ease forwards;
}

.yearPoint{
  position:absolute;
  top:82px;
  width:18px;
  height:18px;
  border-radius:50%;
  border:2px solid #62513a;
  background:#150909;
  transform:translateX(-50%);
}

.yearPoint::after{
  content:attr(data-year);
  position:absolute;
  top:32px;
  left:50%;
  transform:translateX(-50%);
  font-size:14px;
  letter-spacing:3px;
  color:#837569;
}

.p1911{
  left:5%;
  animation:unlockPoint .5s .4s forwards;
}

.p1919{
  left:55%;
  animation:unlockPoint .5s 3s forwards;
}

.p1920{
  left:95%;
  animation:unlockPoint .5s 5.2s forwards;
}

.ship{
  position:absolute;
  top:25px;
  left:1%;
  font-size:48px;
  animation:shipJourney 5.5s ease-in-out forwards;
}

.cineText{
  min-height:80px;
  margin-top:25px;
  font-size:18px;
  line-height:1.7;
  color:#c8beb1;
  transition:.4s;
}

#cineContinue{
  opacity:0;
  pointer-events:none;
  margin-top:20px;
  animation:showContinue .8s 6.2s forwards;
}

@keyframes growTimeline{
  from{width:0}
  to{width:100%}
}

@keyframes shipJourney{
  0%{
    left:1%;
    transform:translateY(0) rotate(-2deg);
  }

  35%{
    transform:translateY(-8px) rotate(2deg);
  }

  65%{
    transform:translateY(5px) rotate(-1deg);
  }

  100%{
    left:90%;
    transform:translateY(0);
  }
}

@keyframes unlockPoint{
  to{
    background:#c8a45c;
    border-color:#f1d28e;
    box-shadow:0 0 20px rgba(200,164,92,.8);
  }
}

@keyframes showContinue{
  to{
    opacity:1;
    pointer-events:auto;
  }
}

@media(max-width:650px){
  .objects{grid-template-columns:repeat(2,1fr)}
  #hud{padding:14px 12px}
  .progressWrap{width:90px}
  .hudBlock{font-size:10px}
}
  /* ===== LEVEL 2 PREMIUM UI ===== */

.level2Top{
  width:min(900px,100%);
  margin:0 auto 15px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:30px;
}

.timerBox{
  flex-shrink:0;
  padding:12px 20px;
  border:1px solid rgba(200,164,92,.45);
  background:rgba(200,164,92,.07);
  color:#d9b96e;
  border-radius:8px;
  font-size:16px;
  letter-spacing:2px;
}

.matchBoard{
  width:min(900px,100%);
  margin:30px auto 0;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:28px;
}

.cardColumn,
.slotColumn{
  display:flex;
  flex-direction:column;
  gap:14px;

  padding:22px;
  border:1px solid rgba(200,164,92,.16);
  background:rgba(255,255,255,.025);
  border-radius:12px;
}

.columnTitle{
  margin-bottom:8px;
  color:#c8a45c;
  font-size:12px;
  letter-spacing:4px;
  text-align:left;
}

/* XÓA HOÀN TOÀN GIAO DIỆN BUTTON MẶC ĐỊNH */

button.conceptCard,
button.dropSlot{
  appearance:none;
  -webkit-appearance:none;

  display:flex;
  align-items:center;

  width:100%;
  min-height:82px;

  padding:16px 18px;

  border-radius:9px;
  border:1px solid rgba(200,164,92,.22);

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.018)
    );

  color:#eadfce;

  font-family:Arial,sans-serif;
  font-size:15px;
  line-height:1.45;
  text-align:left;

  cursor:pointer;

  transition:
    transform .22s ease,
    border-color .22s ease,
    background .22s ease,
    box-shadow .22s ease;
}

button.conceptCard:hover,
button.dropSlot:hover{
  transform:translateY(-3px);
  border-color:#c8a45c;
  background:rgba(200,164,92,.08);
}

button.conceptCard.selected{
  border-color:#d4ad58;

  background:
    linear-gradient(
      135deg,
      rgba(200,164,92,.18),
      rgba(200,164,92,.06)
    );

  box-shadow:
    0 0 0 1px rgba(200,164,92,.15),
    0 8px 30px rgba(0,0,0,.25);

  transform:translateX(7px);
}

button.dropSlot{
  border-style:dashed;
  color:#bdb1a1;
  background:rgba(0,0,0,.13);
}

button.conceptCard.matched,
button.dropSlot.matched{
  border-style:solid;
  border-color:#6f9f68;

  background:
    linear-gradient(
      135deg,
      rgba(74,120,67,.22),
      rgba(74,120,67,.08)
    );

  color:#a9d3a4;

  pointer-events:none;
}

.level2Feedback{
  width:min(900px,100%);
  min-height:48px;

  margin:22px auto 0;
  padding:13px 18px;

  border-top:1px solid rgba(200,164,92,.15);

  color:#c8beb1;

  font-size:15px;
  letter-spacing:.5px;
}

.timerDanger{
  color:#e06460 !important;
  border-color:#b83b38 !important;

  box-shadow:
    0 0 20px rgba(184,59,56,.25);

  animation:timerPulse .7s infinite alternate;
}

@keyframes timerPulse{
  from{
    transform:scale(1);
  }

  to{
    transform:scale(1.06);
  }
}

@media(max-width:750px){

  .matchBoard{
    grid-template-columns:1fr;
  }

  .level2Top{
    align-items:center;
    flex-direction:column;
  }

  button.conceptCard,
  button.dropSlot{
    min-height:70px;
  }
}
</style>
</head>

<body>

<div id="game">
<div class="noise"></div>

<div id="hud">
  <div class="hudBlock">
    <span id="hearts">♥ ♥ ♥</span>
  </div>

  <div class="hudBlock">
    XP <span class="gold" id="xp">0</span>
  </div>

  <div class="hudBlock">
    LEVEL 1 / 5
    <div class="progressWrap">
      <div id="progress"></div>
    </div>
  </div>
</div>

<div id="screen" class="screen">
  <div class="content">

    <div class="small">1911 — 2026</div>

    <h1>
      HÀNH TRÌNH<br>
      <span class="red">TƯ TƯỞNG</span>
    </h1>

    <p class="subtitle">
      Một trải nghiệm tương tác qua những dấu mốc,
      lựa chọn và giá trị trong Tư tưởng Hồ Chí Minh.
      <br><br>
      Mỗi lựa chọn của bạn sẽ tạo nên hành trình.
    </p>

    <button class="btn" id="startBtn">
      BẮT ĐẦU HÀNH TRÌNH →
    </button>

  </div>
</div>

</div>

<script>
const screen = document.getElementById("screen");
const hud = document.getElementById("hud");

let hearts = 3;
let xp = 0;
let found = 0;

document.getElementById("startBtn").addEventListener("click", intro1911);

function intro1911(){

  screen.innerHTML = `
    <div class="content">

      <div class="small">CHƯƠNG 01</div>

      <h1>
        NĂM <span class="red">1911</span>
      </h1>

      <p class="subtitle">
        Một người thanh niên 21 tuổi đứng trước câu hỏi lớn:
        <br><br>
        <strong>Con đường nào có thể đưa dân tộc tới độc lập?</strong>
        <br><br>
        Ngày 5/6/1911, Nguyễn Tất Thành rời Bến Nhà Rồng,
        bắt đầu hành trình tìm đường cứu nước.
      </p>

      <button class="btn" id="enterLevel">
        BƯỚC LÊN CON TÀU →
      </button>

    </div>
  `;

  document.getElementById("enterLevel")
    .addEventListener("click", levelOne);
}

function levelOne(){

  hud.style.display = "flex";

  screen.innerHTML = `
    <div class="content">

      <div class="mission">
        LEVEL 01 · KHỞI HÀNH
      </div>

      <div class="levelTitle">
        TÌM <span class="red">3 MANH MỐI</span>
      </div>

      <p class="subtitle">
        Trong 6 vật phẩm dưới đây, hãy tìm 3 biểu tượng
        phù hợp nhất với một hành trình ra đi khám phá thế giới
        và tìm một con đường mới.
      </p>

      <div class="objects">

        <div class="object" data-correct="true">
          <div class="icon">🚢</div>
          <div class="label">CON TÀU</div>
        </div>

        <div class="object" data-correct="true">
          <div class="icon">🗺️</div>
          <div class="label">BẢN ĐỒ</div>
        </div>

        <div class="object" data-correct="false">
          <div class="icon">👑</div>
          <div class="label">VƯƠNG MIỆN</div>
        </div>

        <div class="object" data-correct="true">
          <div class="icon">🧳</div>
          <div class="label">HÀNH TRANG</div>
        </div>

        <div class="object" data-correct="false">
          <div class="icon">💰</div>
          <div class="label">TÀI SẢN</div>
        </div>

        <div class="object" data-correct="false">
          <div class="icon">🏆</div>
          <div class="label">VINH QUANG</div>
        </div>

      </div>

      <div id="message">
        Tìm đủ 3 manh mối để tiếp tục.
      </div>

    </div>
  `;

  document.querySelectorAll(".object")
    .forEach(item => item.addEventListener("click", chooseObject));
}

function chooseObject(e){

  const item = e.currentTarget;

  if(item.dataset.correct === "true"){

    if(item.classList.contains("correct-found")) return;

    item.classList.add("correct-found");

    found++;
    xp += 100;

    updateHUD();

    document.getElementById("message").innerHTML =
      `<span style="color:#8fb987">✓ MANH MỐI ĐÚNG &nbsp; +100 XP</span>`;

    if(found === 3){

      setTimeout(levelComplete,700);
    }

  } else {

    hearts--;

    item.classList.remove("wrong");
    void item.offsetWidth;
    item.classList.add("wrong");

    updateHUD();

    document.getElementById("message").innerHTML =
      `<span style="color:#d45d58">✕ Đây không phải lựa chọn phù hợp.</span>`;

    if(hearts <= 0){

      setTimeout(gameOver,500);
    }
  }
}

function updateHUD(){

  document.getElementById("xp").textContent = xp;

  let heartText = "";

  for(let i=0;i<3;i++){
    heartText += i < hearts ? "♥ " : "♡ ";
  }

  document.getElementById("hearts").textContent = heartText;
}

function gameOver(){

  screen.innerHTML = `
    <div class="content">

      <div class="small">MISSION FAILED</div>

      <h1>
        THỬ <span class="red">LẠI</span>
      </h1>

      <p class="subtitle">
        Bạn đã sử dụng hết 3 lượt lựa chọn.
        <br>
        Quan sát kỹ hơn và thử lại nhiệm vụ.
      </p>

      <button class="btn" id="retryBtn">
        CHƠI LẠI LEVEL 1
      </button>

    </div>
  `;

  document.getElementById("retryBtn").addEventListener("click",function(){

    hearts = 3;
    xp = 0;
    found = 0;

    updateHUD();
    levelOne();
  });
}

function levelComplete(){

  screen.innerHTML = `
    <div class="content">

      <div class="completeBox">

        <div class="small">
          LEVEL 01 COMPLETE
        </div>

        <h1>
          KHỞI HÀNH<br>
          <span class="red">1911</span>
        </h1>

        <div class="scoreBig">
          +${xp} XP
        </div>

        <p class="subtitle">
          Hành trình tìm đường cứu nước đã bắt đầu.
          <br><br>
          Đây không chỉ là một chuyến đi về địa lý,
          mà là quá trình tìm kiếm một con đường mới
          cho độc lập dân tộc.
        </p>

        <button class="btn" id="nextLevel">
          TIẾP TỤC HÀNH TRÌNH →
        </button>

      </div>

    </div>
  `;

  document.getElementById("nextLevel")
    .addEventListener("click", cinematicJourney);
}


function cinematicJourney(){

  hud.style.display = "none";

  screen.innerHTML = `
    <div class="content cinematic">

      <div class="cineTitle">
        HÀNH TRÌNH ĐANG TIẾP DIỄN
      </div>

      <div class="timelineScene">

        <div class="timelineBase"></div>
        <div class="timelineFill"></div>

        <div class="yearPoint p1911" data-year="1911"></div>

        <div class="yearPoint p1919" data-year="1919"></div>

        <div class="yearPoint p1920" data-year="1920"></div>

        <div class="ship">🚢</div>

      </div>

      <div class="cineText" id="cineText">
        Rời Bến Nhà Rồng...
      </div>

      <button class="btn" id="cineContinue">
        MỞ CHECKPOINT 1920 →
      </button>

    </div>
  `;

  const text = document.getElementById("cineText");

  setTimeout(function(){
    text.innerHTML =
      "1911 — Một hành trình vượt ra ngoài biên giới bắt đầu.";
  },700);

  setTimeout(function(){
    text.innerHTML =
      "1919 — Tiếng nói của nhân dân An Nam được gửi tới Hội nghị Versailles.";
  },3000);

  setTimeout(function(){
    text.innerHTML =
      "<span class='gold'>1920</span> — Một bước ngoặt trong nhận thức về con đường giải phóng dân tộc.";
  },5200);

  setTimeout(function(){

    document.getElementById("cineContinue")
      .addEventListener("click", checkpoint1920);

  },6200);
}


function checkpoint1920(){

  screen.innerHTML = `
    <div class="content">

      <div class="small">
        CHECKPOINT UNLOCKED
      </div>

      <h1>
        NĂM <span class="red">1920</span>
      </h1>

      <p class="subtitle">
        Sau nhiều năm quan sát, trải nghiệm và tìm kiếm,
        Nguyễn Ái Quốc đứng trước một bước ngoặt quan trọng.
        <br><br>
        Một con đường mới đang dần được xác định.
      </p>

      <button class="btn" id="level2Btn">
        BẮT ĐẦU LEVEL 02 →
      </button>

    </div>
  `;

  document.getElementById("level2Btn")
    .addEventListener("click", levelTwo);
}


let level2Matched = 0;
let level2Selected = null;
let level2Interval = null;
let level2Time = 45;
let level2BaseXP = 0;
let level2Active = false;


function levelTwo(resetBase = true){

  if(resetBase){
    level2BaseXP = xp;
  }

  hearts = 3;
  level2Matched = 0;
  level2Selected = null;
  level2Time = 45;
  level2Active = true;

  updateHUD();

  hud.style.display = "flex";

  document.querySelector("#hud .hudBlock:last-child")
    .firstChild.textContent = "LEVEL 2 / 5";

  document.getElementById("progress").style.width = "40%";

  screen.innerHTML = `
    <div class="content">

      <div class="level2Top">

        <div>
          <div class="mission">
            LEVEL 02 · BƯỚC NGOẶT
          </div>

          <div class="levelTitle">
            GIẢI MÃ <span class="red">1920</span>
          </div>
        </div>

        <div class="timerBox" id="timerBox">
          ⏱ <span id="level2Timer">45</span>s
        </div>

      </div>

      <p class="subtitle">
        Ghép mỗi khái niệm bên trái với ý nghĩa phù hợp bên phải.
        <br>
        Bạn có 45 giây và 3 lượt sai.
      </p>

      <div class="matchBoard">

        <div class="cardColumn">

          <div class="columnTitle">
            MẢNH GHÉP
          </div>

          <button class="conceptCard"
                  draggable="true"
                  data-match="theory">
            📜 Luận cương về vấn đề dân tộc và thuộc địa
          </button>

          <button class="conceptCard"
                  draggable="true"
                  data-match="path">
            🧭 Con đường cách mạng vô sản
          </button>

          <button class="conceptCard"
                  draggable="true"
                  data-match="tours">
            🏛 Đại hội Tours năm 1920
          </button>

        </div>


        <div class="slotColumn">

          <div class="columnTitle">
            VAI TRÒ / Ý NGHĨA
          </div>

          <button class="dropSlot"
                  data-match="path">
            Con đường giải phóng dân tộc được lựa chọn
          </button>

          <button class="dropSlot"
                  data-match="tours">
            Dấu mốc thể hiện lựa chọn chính trị quan trọng
          </button>

          <button class="dropSlot"
                  data-match="theory">
            Tài liệu tạo bước ngoặt trong nhận thức
          </button>

        </div>

      </div>

      <div class="level2Feedback" id="level2Feedback">
        Chọn một mảnh ghép rồi chọn ô tương ứng.
      </div>

    </div>
  `;

  setupLevel2();

  clearInterval(level2Interval);

  level2Interval = setInterval(function(){

    if(!level2Active) return;

    level2Time--;

    document.getElementById("level2Timer").textContent = level2Time;

    if(level2Time <= 10){
      document.getElementById("timerBox")
        .classList.add("timerDanger");
    }

    if(level2Time <= 0){

      clearInterval(level2Interval);

      level2Fail("HẾT THỜI GIAN");

    }

  },1000);
}


function setupLevel2(){

  const cards = document.querySelectorAll(".conceptCard");
  const slots = document.querySelectorAll(".dropSlot");

  cards.forEach(function(card){

    card.addEventListener("click",function(){

      cards.forEach(c => c.classList.remove("selected"));

      card.classList.add("selected");

      level2Selected = card;

      document.getElementById("level2Feedback").textContent =
        "Đã chọn mảnh ghép. Hãy chọn vị trí phù hợp.";

    });


    card.addEventListener("dragstart",function(e){

      e.dataTransfer.setData(
        "text/plain",
        card.dataset.match
      );

      level2Selected = card;

    });

  });


  slots.forEach(function(slot){

    slot.addEventListener("click",function(){

      if(!level2Selected){

        document.getElementById("level2Feedback").textContent =
          "Hãy chọn một mảnh ghép trước.";

        return;
      }

      checkLevel2Match(level2Selected,slot);

    });


    slot.addEventListener("dragover",function(e){
      e.preventDefault();
    });


    slot.addEventListener("drop",function(e){

      e.preventDefault();

      const match = e.dataTransfer.getData("text/plain");

      const card = [...document.querySelectorAll(".conceptCard")]
        .find(c => c.dataset.match === match);

      if(card){
        checkLevel2Match(card,slot);
      }

    });

  });
}


function checkLevel2Match(card,slot){

  if(!level2Active) return;

  if(card.dataset.match === slot.dataset.match){

    card.classList.remove("selected");

    card.classList.add("matched");

    slot.classList.add("matched");

    slot.innerHTML =
      "✓ " + slot.innerHTML;

    xp += 150;
    level2Matched++;

    updateHUD();

    document.getElementById("level2Feedback").innerHTML =
      `<span style="color:#8fb987">
      ✓ GHÉP CHÍNH XÁC &nbsp; +150 XP
      </span>`;

    level2Selected = null;

    if(level2Matched === 3){

      level2Active = false;

      clearInterval(level2Interval);

      setTimeout(level2Complete,800);

    }

  } else {

    hearts--;

    updateHUD();

    slot.classList.remove("wrong");

    void slot.offsetWidth;

    slot.classList.add("wrong");

    document.getElementById("level2Feedback").innerHTML =
      `<span style="color:#d45d58">
      ✕ Chưa đúng mối liên hệ. Hãy thử lại.
      </span>`;

    card.classList.remove("selected");

    level2Selected = null;

    if(hearts <= 0){

      clearInterval(level2Interval);

      level2Fail("BẠN ĐÃ HẾT 3 LƯỢT");

    }

  }
}


function level2Fail(reason){

  level2Active = false;

  clearInterval(level2Interval);

  screen.innerHTML = `
    <div class="content">

      <div class="small">
        LEVEL 02 · MISSION FAILED
      </div>

      <h1>
        ${reason}
      </h1>

      <p class="subtitle">
        Bước ngoặt năm 1920 vẫn chưa được giải mã.
        <br><br>
        Hãy thử lại nhiệm vụ.
      </p>

      <button class="btn" id="retryLevel2">
        THỬ LẠI LEVEL 02 →
      </button>

    </div>
  `;

  document.getElementById("retryLevel2")
    .addEventListener("click",function(){

      xp = level2BaseXP;

      updateHUD();

      levelTwo(false);

    });
}


function level2Complete(){

  level2Active = false;

  clearInterval(level2Interval);

  screen.innerHTML = `
    <div class="content">

      <div class="completeBox">

        <div class="small">
          LEVEL 02 COMPLETE
        </div>

        <h1>
          BƯỚC NGOẶT<br>
          <span class="red">1920</span>
        </h1>

        <div class="scoreBig">
          +450 XP
        </div>

        <p class="subtitle">
          Năm 1920 đánh dấu một bước chuyển quan trọng
          trong quá trình hình thành tư tưởng Hồ Chí Minh.
          <br><br>
          Từ quá trình tìm kiếm,
          một con đường giải phóng dân tộc mới
          dần được xác định.
        </p>

        <button class="btn" id="to1930">
          TIẾP TỤC ĐẾN 1930 →
        </button>

      </div>

    </div>
  `;

  document.getElementById("to1930")
    .addEventListener("click",function(){

      hud.style.display = "none";

      screen.innerHTML = `
        <div class="content">

          <div class="small">
            NEXT CHECKPOINT
          </div>

          <h1>
            NĂM <span class="red">1930</span>
          </h1>

          <p class="subtitle">
            Từ một con đường tư tưởng
            đến yêu cầu thống nhất lực lượng cách mạng.
            <br><br>
            Một thử thách mới đang chờ phía trước.
          </p>

        </div>
      `;

    });
}
</script>
