<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hành Trình Tư Tưởng</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:radial-gradient(circle at center,#351414 0%,#150909 55%,#070404 100%);
  color:#f3eadb;
  min-height:100vh;
}

#game{
  min-height:100vh;
  position:relative;
  overflow:hidden;
}

.noise{
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.07;
  background-image:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(255,255,255,.05) 3px
  );
}

.screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:90px 24px 60px;
  animation:appear .8s ease;
}

.content{
  width:min(950px,100%);
}

.small{
  letter-spacing:6px;
  font-size:13px;
  color:#c8a45c;
  margin-bottom:22px;
}

h1{
  font-size:clamp(45px,8vw,90px);
  line-height:.95;
  margin-bottom:25px;
}

.red{color:#b83b38}
.gold{color:#c8a45c}

.subtitle{
  max-width:700px;
  margin:0 auto 35px;
  color:#c8beb1;
  font-size:18px;
  line-height:1.7;
}

.btn{
  border:1px solid #c8a45c;
  background:transparent;
  color:#f5ead5;
  padding:16px 30px;
  font-size:14px;
  letter-spacing:2px;
  cursor:pointer;
  transition:.25s;
}

.btn:hover{
  background:#c8a45c;
  color:#160909;
  transform:translateY(-3px);
}

/* HUD */
#hud{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  padding:18px 28px;
  display:none;
  justify-content:space-between;
  align-items:center;
  z-index:20;
  background:rgba(8,4,4,.8);
  border-bottom:1px solid rgba(200,164,92,.25);
  backdrop-filter:blur(8px);
}

.hudBlock{
  font-size:13px;
  letter-spacing:2px;
}

#hearts{color:#d95550;font-size:20px}

.progressWrap{
  width:180px;
  height:5px;
  background:#332727;
  margin-top:8px;
}

#progress{
  width:20%;
  height:100%;
  background:#c8a45c;
}

/* LEVEL 1 */
.levelTitle{
  font-size:clamp(32px,6vw,65px);
  margin-bottom:10px;
}

.mission{
  color:#c8a45c;
  letter-spacing:3px;
  font-size:13px;
  margin-bottom:12px;
}

.objects{
  margin:38px auto 25px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  max-width:760px;
}

.object{
  min-height:145px;
  border:1px solid rgba(200,164,92,.25);
  background:rgba(255,255,255,.035);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.25s;
  padding:18px;
}

.object:hover{
  transform:translateY(-6px);
  border-color:#c8a45c;
  background:rgba(200,164,92,.08);
}

.object .icon{
  font-size:48px;
  margin-bottom:12px;
}

.object .label{
  font-size:12px;
  letter-spacing:2px;
  color:#a99f91;
}

.object.correct-found{
  border-color:#7aaa72;
  background:rgba(70,120,60,.12);
  opacity:.55;
  pointer-events:none;
}

.object.wrong{
  animation:shake .35s;
  border-color:#b83b38;
}

#message{
  min-height:35px;
  margin-top:20px;
  font-size:15px;
  letter-spacing:1px;
  color:#d8c9b4;
}

.completeBox{
  padding:45px 25px;
  border:1px solid rgba(200,164,92,.4);
  background:rgba(255,255,255,.025);
  max-width:700px;
  margin:auto;
}

.scoreBig{
  font-size:70px;
  color:#c8a45c;
  margin:15px 0;
  font-weight:bold;
}

@keyframes appear{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-8px)}
  75%{transform:translateX(8px)}
}
/* ===== CINEMATIC 1911 → 1920 ===== */

.cinematic{
  position:relative;
  width:min(1000px,100%);
  min-height:520px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  overflow:hidden;
}

.cineTitle{
  font-size:13px;
  letter-spacing:7px;
  color:#c8a45c;
  margin-bottom:45px;
}

.timelineScene{
  position:relative;
  width:85%;
  max-width:850px;
  height:180px;
  margin:auto;
}

.timelineBase{
  position:absolute;
  left:0;
  right:0;
  top:90px;
  height:2px;
  background:#352929;
}

.timelineFill{
  position:absolute;
  left:0;
  top:90px;
  height:2px;
  width:0;
  background:#c8a45c;
  animation:growTimeline 5.5s ease forwards;
}

.yearPoint{
  position:absolute;
  top:82px;
  width:18px;
  height:18px;
  border-radius:50%;
  border:2px solid #62513a;
  background:#150909;
  transform:translateX(-50%);
}

.yearPoint::after{
  content:attr(data-year);
  position:absolute;
  top:32px;
  left:50%;
  transform:translateX(-50%);
  font-size:14px;
  letter-spacing:3px;
  color:#837569;
}

.p1911{
  left:5%;
  animation:unlockPoint .5s .4s forwards;
}

.p1919{
  left:55%;
  animation:unlockPoint .5s 3s forwards;
}

.p1920{
  left:95%;
  animation:unlockPoint .5s 5.2s forwards;
}

.ship{
  position:absolute;
  top:25px;
  left:1%;
  font-size:48px;
  animation:shipJourney 5.5s ease-in-out forwards;
}

.cineText{
  min-height:80px;
  margin-top:25px;
  font-size:18px;
  line-height:1.7;
  color:#c8beb1;
  transition:.4s;
}

#cineContinue{
  opacity:0;
  pointer-events:none;
  margin-top:20px;
  animation:showContinue .8s 6.2s forwards;
}

@keyframes growTimeline{
  from{width:0}
  to{width:100%}
}

@keyframes shipJourney{
  0%{
    left:1%;
    transform:translateY(0) rotate(-2deg);
  }

  35%{
    transform:translateY(-8px) rotate(2deg);
  }

  65%{
    transform:translateY(5px) rotate(-1deg);
  }

  100%{
    left:90%;
    transform:translateY(0);
  }
}

@keyframes unlockPoint{
  to{
    background:#c8a45c;
    border-color:#f1d28e;
    box-shadow:0 0 20px rgba(200,164,92,.8);
  }
}

@keyframes showContinue{
  to{
    opacity:1;
    pointer-events:auto;
  }
}

@media(max-width:650px){
  .objects{grid-template-columns:repeat(2,1fr)}
  #hud{padding:14px 12px}
  .progressWrap{width:90px}
  .hudBlock{font-size:10px}
}
  /* ===== LEVEL 2 PREMIUM UI ===== */

.level2Top{
  width:min(900px,100%);
  margin:0 auto 15px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:30px;
}
.timerBox{
  flex-shrink:0;
  padding:12px 20px;
  border:1px solid rgba(200,164,92,.45);
  background:rgba(200,164,92,.07);
  color:#d9b96e;
  border-radius:8px;
  font-size:16px;
  letter-spacing:2px;
}

.matchBoard{
  width:min(900px,100%);
  margin:30px auto 0;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:28px;
}

.cardColumn,
.slotColumn{
  display:flex;
  flex-direction:column;
  gap:14px;

  padding:22px;
  border:1px solid rgba(200,164,92,.16);
  background:rgba(255,255,255,.025);
  border-radius:12px;
}

.columnTitle{
  margin-bottom:8px;
  color:#c8a45c;
  font-size:12px;
  letter-spacing:4px;
  text-align:left;
}

/* XÓA HOÀN TOÀN GIAO DIỆN BUTTON MẶC ĐỊNH */

button.conceptCard,
button.dropSlot{
  appearance:none;
  -webkit-appearance:none;

  display:flex;
  align-items:center;

  width:100%;
  min-height:82px;

  padding:16px 18px;

  border-radius:9px;
  border:1px solid rgba(200,164,92,.22);

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.018)
    );

  color:#eadfce;

  font-family:Arial,sans-serif;
  font-size:15px;
  line-height:1.45;
  text-align:left;

  cursor:pointer;

  transition:
    transform .22s ease,
    border-color .22s ease,
    background .22s ease,
    box-shadow .22s ease;
}

button.conceptCard:hover,
button.dropSlot:hover{
  transform:translateY(-3px);
  border-color:#c8a45c;
  background:rgba(200,164,92,.08);
}

button.conceptCard.selected{
  border-color:#d4ad58;

  background:
    linear-gradient(
      135deg,
      rgba(200,164,92,.18),
      rgba(200,164,92,.06)
    );

  box-shadow:
    0 0 0 1px rgba(200,164,92,.15),
    0 8px 30px rgba(0,0,0,.25);

  transform:translateX(7px);
}

button.dropSlot{
  border-style:dashed;
  color:#bdb1a1;
  background:rgba(0,0,0,.13);
}

button.conceptCard.matched,
button.dropSlot.matched{
  border-style:solid;
  border-color:#6f9f68;

  background:
    linear-gradient(
      135deg,
      rgba(74,120,67,.22),
      rgba(74,120,67,.08)
    );

  color:#a9d3a4;

  pointer-events:none;
}

.level2Feedback{
  width:min(900px,100%);
  min-height:48px;

  margin:22px auto 0;
  padding:13px 18px;

  border-top:1px solid rgba(200,164,92,.15);

  color:#c8beb1;

  font-size:15px;
  letter-spacing:.5px;
}

.timerDanger{
  color:#e06460 !important;
  border-color:#b83b38 !important;

  box-shadow:
    0 0 20px rgba(184,59,56,.25);

  animation:timerPulse .7s infinite alternate;
}

@keyframes timerPulse{
  from{
    transform:scale(1);
  }

  to{
    transform:scale(1.06);
  }
}

@media(max-width:750px){

  .matchBoard{
    grid-template-columns:1fr;
  }

  .level2Top{
    align-items:center;
    flex-direction:column;
  }

  button.conceptCard,
  button.dropSlot{
    min-height:70px;
  }
}
  /* ===== CINEMATIC 1930 ===== */

.c1930{
  position:relative;
  width:min(1000px,100%);
  min-height:620px;
  overflow:hidden;
}

.c1930Tag{
  color:#c8a45c;
  letter-spacing:7px;
  font-size:12px;
  margin-bottom:20px;
}

.c1930Title{
  font-size:clamp(42px,7vw,82px);
  line-height:1;
  margin-bottom:18px;
}

.c1930Sub{
  color:#a99f91;
  font-size:15px;
  letter-spacing:2px;
  margin-bottom:35px;
}

.fractureScene{
  position:relative;
  width:min(900px,100%);
  height:250px;
  margin:0 auto;
}

.orgStream{
  position:absolute;
  width:230px;
  min-height:58px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:12px 16px;

  border:1px solid rgba(184,59,56,.45);
  background:rgba(184,59,56,.08);

  color:#e7d9c8;

  font-size:12px;
  line-height:1.4;
  letter-spacing:1px;

  box-shadow:
    0 0 20px rgba(184,59,56,.08);

  opacity:0;
}

.org1{
  left:0;
  top:15px;
  animation:orgEnterLeft .7s .5s forwards;
}

.org2{
  right:0;
  top:90px;
  animation:orgEnterRight .7s 1.1s forwards;
}

.org3{
  left:40px;
  bottom:10px;
  animation:orgEnterLeft .7s 1.7s forwards;

  flex-direction:column;
  gap:6px;

  border-style:dashed;
  border-color:rgba(200,164,92,.28);

  color:#93877c;
  background:rgba(200,164,92,.025);
}

.org3 .lateJoin{
  color:#c8a45c;
  font-size:9px;
  letter-spacing:2px;
}

.unityCore{
  position:absolute;

  left:50%;
  top:50%;

  width:105px;
  height:105px;

  transform:translate(-50%,-50%) scale(.3);

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  border:1px solid rgba(200,164,92,.8);

  background:
    radial-gradient(
      circle,
      rgba(200,164,92,.28),
      rgba(200,164,92,.03)
    );

  color:#e9c978;

  font-size:13px;
  letter-spacing:3px;

  opacity:0;

  animation:coreAwake .8s 3.2s forwards;
}

.unityLine{
  position:absolute;

  left:50%;
  top:50%;

  width:0;
  height:2px;

  transform-origin:left center;

  background:linear-gradient(
    90deg,
    rgba(184,59,56,.8),
    #c8a45c
  );

  box-shadow:0 0 14px rgba(200,164,92,.55);

  opacity:0;
}

.line1{
  transform:rotate(-155deg);
  animation:lineGrow .8s 3.8s forwards;
}

.line2{
  transform:rotate(0deg);
  animation:lineGrow .8s 4.1s forwards;
}
.c1930Text{
  min-height:70px;

  width:min(760px,100%);
  margin:18px auto 0;

  color:#c8beb1;

  font-size:18px;
  line-height:1.65;

  transition:.35s;
}

.c1930Stamp{
  margin:25px auto 0;

  width:max-content;

  padding:13px 25px;

  border:3px solid #b83b38;

  color:#d6605c;

  font-weight:bold;
  letter-spacing:5px;

  transform:rotate(-5deg) scale(2.2);

  opacity:0;

  animation:stamp1930 .35s 5.7s forwards;
}

@keyframes orgEnterLeft{
  from{
    opacity:0;
    transform:translateX(-60px);
  }

  to{
    opacity:1;
    transform:translateX(0);
  }
}

@keyframes orgEnterRight{
  from{
    opacity:0;
    transform:translateX(60px);
  }

  to{
    opacity:1;
    transform:translateX(0);
  }
}

@keyframes coreAwake{
  to{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
    box-shadow:
      0 0 20px rgba(200,164,92,.35),
      0 0 60px rgba(200,164,92,.15);
  }
}

@keyframes lineGrow{
  from{
    width:0;
    opacity:0;
  }

  to{
    width:230px;
    opacity:1;
  }
}

@keyframes stamp1930{
  0%{
    opacity:0;
    transform:rotate(-5deg) scale(2.2);
  }

  70%{
    opacity:1;
    transform:rotate(-5deg) scale(.9);
  }

  100%{
    opacity:1;
    transform:rotate(-5deg) scale(1);
  }
}

@media(max-width:750px){

  .fractureScene{
    height:330px;
  }

  .orgStream{
    width:180px;
    font-size:10px;
  }

  .org1{
    top:0;
  }

  .org2{
    top:110px;
  }

  .org3{
    bottom:0;
  }

  .unityLine{
    display:none;
  }
}
  /* ===== LEVEL 3 · BOSS PHASE 1 ===== */

.boss1930{
  width:min(980px,100%);
  position:relative;
}

.bossTop{
  width:min(850px,100%);
  margin:0 auto 22px;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
}

.bossLabel{
  text-align:left;
  color:#c8a45c;
  font-size:12px;
  letter-spacing:4px;
  line-height:1.7;
}

.bossTimer{
  min-width:100px;
  padding:12px 17px;

  border:1px solid rgba(184,59,56,.55);
  border-radius:8px;

  background:rgba(184,59,56,.08);

  color:#e77b76;
  font-size:15px;
  letter-spacing:2px;

  box-shadow:0 0 20px rgba(184,59,56,.08);
}

.unityBox{
  width:min(780px,100%);
  margin:0 auto 28px;
}

.unityText{
  margin-bottom:9px;

  display:flex;
  justify-content:space-between;

  color:#9e9183;

  font-size:11px;
  letter-spacing:3px;
}

.unityTrack{
  height:8px;
  overflow:hidden;

  background:#302222;

  border:1px solid rgba(255,255,255,.04);
  border-radius:20px;
}

#unityFill{
  height:100%;
  width:25%;

  background:
    linear-gradient(
      90deg,
      #8f302e,
      #c8a45c
    );

  box-shadow:0 0 25px rgba(200,164,92,.35);

  transition:width .55s ease;
}

.crisisCard{
  width:min(820px,100%);
  margin:0 auto;

  padding:30px;

  border:1px solid rgba(200,164,92,.2);
  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.045),
      rgba(255,255,255,.012)
    );

  box-shadow:
    0 20px 70px rgba(0,0,0,.18);
}

.crisisNumber{
  margin-bottom:13px;

  color:#b83b38;

  font-size:11px;
  letter-spacing:5px;
}

.crisisQuestion{
  margin-bottom:25px;

  color:#f0e6d8;

  font-size:23px;
  line-height:1.5;
}

.choiceGrid1930{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}

.choice1930{
  appearance:none;
  -webkit-appearance:none;

  width:100%;

  padding:17px 20px;

  border:1px solid rgba(200,164,92,.2);
  border-radius:9px;

  background:rgba(0,0,0,.16);

  color:#e8ddce;

  font-family:Arial,sans-serif;
  font-size:15px;
  line-height:1.45;

  text-align:left;

  cursor:pointer;

  transition:
    transform .22s ease,
    border-color .22s ease,
    background .22s ease;
}

.choice1930:hover{
  transform:translateX(8px);

  border-color:#c8a45c;

  background:rgba(200,164,92,.08);
}

.choice1930.correct1930{
  border-color:#70a66b;

  color:#add6a8;

  background:rgba(65,110,60,.16);

  box-shadow:0 0 20px rgba(80,140,70,.12);
}

.choice1930.wrong1930{
  border-color:#b83b38;

  color:#e47a76;

  background:rgba(150,40,40,.14);

  animation:shake .35s;
}

.phaseKnowledge{
  width:min(820px,100%);
  min-height:88px;

  margin:18px auto 0;
  padding:16px 20px;

  border-left:2px solid #c8a45c;

  background:rgba(200,164,92,.04);

  color:#c8beb1;

  font-size:14px;
  line-height:1.7;

  text-align:left;
}

.phaseXP{
  color:#c8a45c;
  font-weight:bold;
  letter-spacing:1px;
}

.combo1930{
  position:fixed;

  right:35px;
  top:105px;

  z-index:50;

  color:#c8a45c;

  font-size:21px;
  font-weight:bold;
  letter-spacing:2px;

  opacity:0;

  transform:scale(.7);

  pointer-events:none;
}

.combo1930.showCombo{
  animation:comboPop .7s ease;
}

.bossDanger{
  animation:bossPulse .55s infinite alternate;
}

@keyframes comboPop{

  0%{
    opacity:0;
    transform:scale(.6);
  }

  35%{
    opacity:1;
    transform:scale(1.25);
  }

  100%{
    opacity:0;
    transform:scale(1);
  }
}

@keyframes bossPulse{

  from{
    box-shadow:0 0 5px rgba(184,59,56,.1);
  }

  to{
    box-shadow:0 0 28px rgba(184,59,56,.5);
  }
}

@media(max-width:700px){

  .bossTop{
    flex-direction:column;
    align-items:center;
  }

  .bossLabel{
    text-align:center;
  }

  .crisisQuestion{
    font-size:18px;
  }

  .crisisCard{
    padding:22px 16px;
  }

  .combo1930{
    top:90px;
    right:15px;
  }
}
  /* ===== LEVEL 3 · PHASE 2 · STRATEGY BOARD ===== */

.phase2Wrap{
  width:min(1100px,100%);
}

.phase2Header{
  width:min(1000px,100%);
  margin:0 auto 25px;

  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:25px;
}

.phase2Title{
  text-align:left;
}

.phase2Title .small{
  margin-bottom:10px;
}

.docMeter{
  width:250px;
}

.docMeterText{
  display:flex;
  justify-content:space-between;

  margin-bottom:8px;

  color:#a99d8f;

  font-size:10px;
  letter-spacing:2px;
}

.docMeterTrack{
  height:7px;

  overflow:hidden;

  border-radius:20px;

  background:#302323;
}

#docMeterFill{
  width:0%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      #8e302d,
      #c8a45c
    );

  box-shadow:
    0 0 20px rgba(200,164,92,.4);

    rgba(200,164,92,.15);

  border-bottom:
    1px solid
    rgba(200,164,92,.15);

  color:#8e8174;

  font-size:10px;
  letter-spacing:3px;
}

.level4ArchitectureProgress strong{
  color:#c8a45c;
}


/* ==================================================
   ARCHITECTURE BOARD
================================================== */

.level4ArchitectureBoard{
  position:relative;

  width:min(900px,100%);

  margin:
    0 auto 24px;

  padding:
    22px 20px 25px;

  overflow:hidden;

  border:
    1px solid
    rgba(200,164,92,.2);

  border-radius:14px;

  background:
    radial-gradient(
      circle at 50% 10%,
      rgba(200,164,92,.07),
      rgba(0,0,0,.2) 58%
    );
}


/* ===== STATE CORE ===== */

.architectureStateCore{
  position:relative;

  width:170px;
  min-height:72px;

  margin:
    0 auto 50px;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:15px;

  border:
    1px solid
    rgba(200,164,92,.42);

  background:
    rgba(200,164,92,.055);

  color:#e1c16e;

  font-size:14px;
  font-weight:bold;

  line-height:1.4;
  letter-spacing:3px;

  z-index:4;

  box-shadow:
    0 0 25px
    rgba(200,164,92,.06);

  transition:
    border-color .5s ease,
    box-shadow .5s ease,
    background .5s ease;
}


/* ===== MAIN TRUNK ===== */

.architectureTrunk{
  position:absolute;

  left:50%;
  top:92px;

  width:1px;
  height:46px;

  background:
    linear-gradient(
      180deg,
      rgba(200,164,92,.7),
      rgba(200,164,92,.12)
    );

  transform:
    translateX(-50%);
}


/* ===== HORIZONTAL NETWORK ===== */

.architectureNetworkLine{
  position:absolute;

  left:17%;
  right:17%;

  top:137px;

  height:1px;

  background:
    rgba(200,164,92,.14);

  transition:
    background .6s ease,
    box-shadow .6s ease;
}


/* ==================================================
   THREE PRINCIPLE SLOTS
================================================== */

.architectureSlotGrid{
  position:relative;

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:14px;

  z-index:3;
}

.architectureSlot{
  position:relative;

  min-height:145px;

  padding:
    18px 15px;

  border:
    1px dashed
    rgba(200,164,92,.28);

  border-radius:10px;

  background:
    rgba(0,0,0,.16);

  color:#9c9185;

  cursor:pointer;

  transition:
    transform .25s ease,
    border-color .25s ease,
    background .25s ease,
    box-shadow .25s ease;
}

.architectureSlot:hover{
  transform:
    translateY(-3px);

  border-color:
    rgba(200,164,92,.65);

  background:
    rgba(200,164,92,.045);
}


/* ===== VERTICAL SLOT LINK ===== */

.architectureSlot::before{
  content:"";

  position:absolute;

  left:50%;
  top:-22px;

  width:1px;
  height:22px;

  transform:
    translateX(-50%);

  background:
    rgba(200,164,92,.18);

  transition:
    background .5s ease,
    box-shadow .5s ease;
}


.architectureSlotNumber{
  margin-bottom:10px;

  color:#b83b38;

  font-size:9px;
  letter-spacing:4px;
}

.architectureSlotTarget{
  margin-bottom:9px;

  color:#ded2c2;

  font-size:13px;
  font-weight:bold;

  letter-spacing:1px;
}

.architectureSlotDesc{
  color:#8f8378;

  font-size:11px;
  line-height:1.55;
}


/* ==================================================
   COMPLETED SLOT
================================================== */

.architectureSlot.architectureMatched{
  border-style:solid;

  border-color:#78a872;

  background:
    linear-gradient(
      135deg,
      rgba(75,130,70,.17),
      rgba(200,164,92,.045)
    );

  box-shadow:
    0 0 28px
    rgba(80,140,70,.09);
}

.architectureSlot.architectureMatched::before{
  background:#c8a45c;

  box-shadow:
    0 0 10px
    rgba(200,164,92,.45);
}

.architectureSlot.architectureMatched
.architectureSlotNumber{
  color:#8fbd87;
}

.architectureSlot.architectureMatched
.architectureSlotTarget{
  color:#aed0a8;
}


/* ===== WRONG DROP ===== */

.architectureSlot.architectureWrong{
  border-color:#b83b38;

  background:
    rgba(184,59,56,.09);

  animation:
    shake .35s;
}


/* ==================================================
   PRINCIPLE FRAGMENTS
================================================== */

.level4ArchitectureTray{
  width:min(900px,100%);

  margin:
    0 auto;

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:12px;
}

.architectureFragment{
  appearance:none;
  -webkit-appearance:none;

  min-height:78px;

  padding:
    15px 14px;

  border:
    1px solid
    rgba(200,164,92,.25);

  border-radius:9px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.04),
      rgba(0,0,0,.13)
    );

  color:#e8ddce;

  font-family:
    Arial,sans-serif;

  font-size:14px;
  font-weight:bold;

  letter-spacing:2px;

  cursor:grab;

  transition:
    transform .22s ease,
    border-color .22s ease,
    background .22s ease,
    box-shadow .22s ease;
}

.architectureFragment:hover{
  transform:
    translateY(-4px);

  border-color:#c8a45c;

  background:
    rgba(200,164,92,.08);
}

.architectureFragment.selectedArchitectureFragment{
  border-color:#e0bf69;

  background:
    rgba(200,164,92,.14);

  box-shadow:
    0 0 24px
    rgba(200,164,92,.12);

  transform:
    translateY(-3px);
}

.architectureFragment.usedArchitectureFragment{
  opacity:.22;

  pointer-events:none;

  transform:
    scale(.96);
}


/* ==================================================
   FEEDBACK + SYSTEM STATUS
================================================== */

.level4ArchitectureFeedback{
  width:min(900px,100%);

  min-height:68px;

  margin:
    20px auto 0;

  padding:
    14px 17px;

  border-left:
    2px solid #c8a45c;

  background:
    rgba(200,164,92,.035);

  color:#bdb1a3;

  font-size:13px;
  line-height:1.6;

  text-align:left;
}


.architectureSystemStatus{
  width:max-content;

  max-width:100%;

  margin:
    18px auto 0;

  padding:
    9px 15px;

  border:
    1px solid
    rgba(200,164,92,.22);

  color:#8f8377;

  font-size:9px;
  letter-spacing:4px;

  transition:
    color .5s ease,
    border-color .5s ease,
    box-shadow .5s ease;
}


/* ==================================================
   SYSTEM COMPLETE
================================================== */

.level4ArchitectureBoard.architectureComplete
.architectureStateCore{

  border-color:#c8a45c;

  background:
    rgba(200,164,92,.12);

  box-shadow:
    0 0 35px
    rgba(200,164,92,.2);
}


.level4ArchitectureBoard.architectureComplete
.architectureNetworkLine{

  background:#c8a45c;

  box-shadow:
    0 0 12px
    rgba(200,164,92,.45);
}


.architectureSystemStatus.systemStable{

  color:#9fc895;

  border-color:#78a872;

  box-shadow:
    0 0 20px
    rgba(80,140,70,.1);
}


#level4ArchitectureContinue{
  display:none;

  margin-top:20px;
}


/* ==================================================
   MOBILE
================================================== */

@media(max-width:760px){

  .architectureSlotGrid,
  .level4ArchitectureTray{

    grid-template-columns:1fr;

  }


  .architectureTrunk,
  .architectureNetworkLine,
  .architectureSlot::before{

    display:none;

  }


  .architectureStateCore{

    margin-bottom:20px;

  }


  .architectureSlot{

    min-height:115px;

  }

}

/* ===== ANIMATION ===== */

@keyframes foodNodePulse{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.35);
  }

}

@keyframes foodGrain1{

  from{
    transform:
      translate(0,0)
      rotate(0deg);
  }

  to{
    transform:
      translate(95px,37px)
      rotate(180deg);
  }

}

@keyframes foodGrain2{

  from{
    transform:
      translate(0,0)
      rotate(0deg);
  }

  to{
    transform:
      translate(-95px,37px)
      rotate(-180deg);
  }

}

@keyframes foodGrain3{

  from{
    transform:
      translate(0,0);
  }

  to{
    transform:
      translate(56px,-42px);
  }

}

@keyframes foodGrain4{

  from{
    transform:
      translate(0,0);
  }

  to{
    transform:
      translate(-56px,-42px);
  }

}

@keyframes foodFailureFlash{

  0%,100%{
    background-color:
      transparent;
  }

  45%{
    background-color:
      rgba(184,59,56,.14);
  }

}

    border-color:#c8a45c;

    color:#e2c477;

    background:
      rgba(200,164,92,.1);

    box-shadow:
      0 0 28px
      rgba(200,164,92,.32);

    transform:scale(1.08);
  }

}

@keyframes level4TransitionFade{

  from{
    opacity:0;
  }

  to{
    opacity:1;
  }

}

@keyframes level4DossierEnter{

  from{
    opacity:0;
    transform:
      translateY(22px);
  }

  to{
    opacity:1;
    transform:
      translateY(0);
  }

}

@keyframes level4UnlockButton{

  to{
    opacity:1;
    pointer-events:auto;
  }

}

@keyframes level4TransitionScan{

  0%{
    top:5%;
    opacity:0;
  }

  20%{
    opacity:.8;
  }

  80%{
    opacity:.8;
  }

  100%{
    top:95%;
    opacity:0;
  }

}
@keyframes level4WrongDecision{

  0%,100%{
    transform:translateX(0);
  }

  25%{
    transform:translateX(-7px);
  }

  75%{
    transform:translateX(7px);
  }

}

@keyframes level4FeedbackIn{

  from{
    opacity:0;
    transform:translateY(9px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

@keyframes level4StampIn{

  0%{
    opacity:0;
    transform:
      rotate(-2deg)
      scale(1.8);
  }

  70%{
    opacity:1;
    transform:
      rotate(-2deg)
      scale(.93);
  }

  100%{
    opacity:1;
    transform:
      rotate(-2deg)
      scale(1);
  }

}

@keyframes level4DamagePulse{

  0%,100%{
    box-shadow:
      0 0 0
      rgba(184,59,56,0);
  }

  50%{
    box-shadow:
      0 0 35px
      rgba(184,59,56,.28);
  }

}


@media(max-width:800px){

  .level4CrisisStage{
    grid-template-columns:1fr;
  }

  .level4ChoiceGrid{
    grid-template-columns:1fr;
  }

}
@keyframes level4MeterSweep{

  0%{
    left:-55%;
    opacity:0;
  }

  25%{
    opacity:1;
  }

  100%{
    left:130%;
    opacity:0;
  }

}

@keyframes level4DeltaRise{

  0%{
    opacity:0;
    transform:
      translateY(10px);
  }

  25%{
    opacity:1;
    transform:
      translateY(0);
  }

  75%{

  }

  100%{

<body>

<div id="game">
<div class="noise"></div>

<div id="hud">
  <div class="hudBlock">
    <span id="hearts">♥ ♥ ♥</span>
  </div>

  <div class="hudBlock">
    XP <span class="gold" id="xp">0</span>
  </div>

  <div class="hudBlock">
    LEVEL 1 / 5
    <div class="progressWrap">
      <div id="progress"></div>
    </div>
  </div>
</div>

<div id="screen" class="screen">
  <div class="content">

    <div class="small">1911 — 2026</div>

    <h1>
      HÀNH TRÌNH<br>
      <span class="red">TƯ TƯỞNG</span>
    </h1>

    <p class="subtitle">
      Một trải nghiệm tương tác qua những dấu mốc,
      lựa chọn và giá trị trong Tư tưởng Hồ Chí Minh.
      <br><br>
      Mỗi lựa chọn của bạn sẽ tạo nên hành trình.
    </p>

    <button class="btn" id="startBtn">
      BẮT ĐẦU HÀNH TRÌNH →
    </button>

  </div>
</div>

</div>

<script>
const screen = document.getElementById("screen");
const hud = document.getElementById("hud");

let hearts = 3;
let xp = 0;
let found = 0;

document.getElementById("startBtn").addEventListener("click", intro1911);

function intro1911(){

  screen.innerHTML = `
    <div class="content">

      <div class="small">CHƯƠNG 01</div>

      <h1>
        NĂM <span class="red">1911</span>
      </h1>

      <p class="subtitle">
        Một người thanh niên 21 tuổi đứng trước câu hỏi lớn:
        <br><br>
        <strong>Con đường nào có thể đưa dân tộc tới độc lập?</strong>
        <br><br>
        Ngày 5/6/1911, Nguyễn Tất Thành rời Bến Nhà Rồng,
        bắt đầu hành trình tìm đường cứu nước.
      </p>

      <button class="btn" id="enterLevel">
        BƯỚC LÊN CON TÀU →
      </button>

    </div>
  `;

  document.getElementById("enterLevel")
    .addEventListener("click", levelOne);
}

function levelOne(){

  hud.style.display = "flex";

  screen.innerHTML = `
    <div class="content">

      <div class="mission">
        LEVEL 01 · KHỞI HÀNH
      </div>

      <div class="levelTitle">
        TÌM <span class="red">3 MANH MỐI</span>
      </div>

      <p class="subtitle">
        Trong 6 vật phẩm dưới đây, hãy tìm 3 biểu tượng
        phù hợp nhất với một hành trình ra đi khám phá thế giới
        và tìm một con đường mới.
      </p>

      <div class="objects">

        <div class="object" data-correct="true">
          <div class="icon">🚢</div>
          <div class="label">CON TÀU</div>
        </div>

        <div class="object" data-correct="true">
          <div class="icon">🗺️</div>
          <div class="label">BẢN ĐỒ</div>
        </div>

        <div class="object" data-correct="false">
          <div class="icon">👑</div>
          <div class="label">VƯƠNG MIỆN</div>
        </div>

        <div class="object" data-correct="true">
          <div class="icon">🧳</div>
          <div class="label">HÀNH TRANG</div>
        </div>

        <div class="object" data-correct="false">
          <div class="icon">💰</div>
          <div class="label">TÀI SẢN</div>
        </div>

        <div class="object" data-correct="false">
          <div class="icon">🏆</div>
          <div class="label">VINH QUANG</div>
        </div>

      </div>

      <div id="message">
        Tìm đủ 3 manh mối để tiếp tục.
      </div>

    </div>
  `;

  document.querySelectorAll(".object")
    .forEach(item => item.addEventListener("click", chooseObject));
}

function chooseObject(e){

  const item = e.currentTarget;

  if(item.dataset.correct === "true"){

    if(item.classList.contains("correct-found")) return;

    item.classList.add("correct-found");

    found++;
    xp += 100;

    updateHUD();

    document.getElementById("message").innerHTML =
      `<span style="color:#8fb987">✓ MANH MỐI ĐÚNG &nbsp; +100 XP</span>`;

    if(found === 3){

      setTimeout(levelComplete,700);
    }

  } else {

    hearts--;

    item.classList.remove("wrong");
    void item.offsetWidth;
    item.classList.add("wrong");

    updateHUD();

    document.getElementById("message").innerHTML =
      `<span style="color:#d45d58">✕ Đây không phải lựa chọn phù hợp.</span>`;

    if(hearts <= 0){

      setTimeout(gameOver,500);
    }
  }
}

function updateHUD(){

  document.getElementById("xp").textContent = xp;

  let heartText = "";

  for(let i=0;i<3;i++){
    heartText += i < hearts ? "♥ " : "♡ ";
  }

  document.getElementById("hearts").textContent = heartText;
}

function gameOver(){

  screen.innerHTML = `
    <div class="content">

      <div class="small">MISSION FAILED</div>

      <h1>
        THỬ <span class="red">LẠI</span>
      </h1>

      <p class="subtitle">
        Bạn đã sử dụng hết 3 lượt lựa chọn.
        <br>
        Quan sát kỹ hơn và thử lại nhiệm vụ.
      </p>

      <button class="btn" id="retryBtn">
        CHƠI LẠI LEVEL 1
      </button>

    </div>
  `;

  document.getElementById("retryBtn").addEventListener("click",function(){

    hearts = 3;
    xp = 0;
    found = 0;

    updateHUD();
    levelOne();
  });
}

function levelComplete(){

  screen.innerHTML = `
    <div class="content">

      <div class="completeBox">

        <div class="small">
          LEVEL 01 COMPLETE
        </div>

        <h1>
          KHỞI HÀNH<br>
          <span class="red">1911</span>
        </h1>

        <div class="scoreBig">
          +${xp} XP
        </div>

        <p class="subtitle">
          Hành trình tìm đường cứu nước đã bắt đầu.
          <br><br>
          Đây không chỉ là một chuyến đi về địa lý,
          mà là quá trình tìm kiếm một con đường mới
          cho độc lập dân tộc.
        </p>

        <button class="btn" id="nextLevel">
          TIẾP TỤC HÀNH TRÌNH →
        </button>

      </div>

    </div>
  `;

  document.getElementById("nextLevel")
    .addEventListener("click", cinematicJourney);
}


function cinematicJourney(){

  hud.style.display = "none";

  screen.innerHTML = `
    <div class="content cinematic">

      <div class="cineTitle">
        HÀNH TRÌNH ĐANG TIẾP DIỄN
      </div>

      <div class="timelineScene">

        <div class="timelineBase"></div>
        <div class="timelineFill"></div>

        <div class="yearPoint p1911" data-year="1911"></div>

        <div class="yearPoint p1919" data-year="1919"></div>

        <div class="yearPoint p1920" data-year="1920"></div>

        <div class="ship">🚢</div>

      </div>

      <div class="cineText" id="cineText">
        Rời Bến Nhà Rồng...
      </div>

      <button class="btn" id="cineContinue">
        MỞ CHECKPOINT 1920 →
      </button>

    </div>
  `;

  const text = document.getElementById("cineText");

  setTimeout(function(){
    text.innerHTML =
      "1911 — Một hành trình vượt ra ngoài biên giới bắt đầu.";
  },700);

  setTimeout(function(){
    text.innerHTML =
      "1919 — Tiếng nói của nhân dân An Nam được gửi tới Hội nghị Versailles.";
  },3000);

  setTimeout(function(){
    text.innerHTML =
      "<span class='gold'>1920</span> — Một bước ngoặt trong nhận thức về con đường giải phóng dân tộc.";
  },5200);

  setTimeout(function(){

    document.getElementById("cineContinue")
      .addEventListener("click", checkpoint1920);

  },6200);
}


function checkpoint1920(){

  screen.innerHTML = `
    <div class="content">

      <div class="small">
        CHECKPOINT UNLOCKED
      </div>

      <h1>
        NĂM <span class="red">1920</span>
      </h1>

      <p class="subtitle">
        Sau nhiều năm quan sát, trải nghiệm và tìm kiếm,
        Nguyễn Ái Quốc đứng trước một bước ngoặt quan trọng.
        <br><br>
        Một con đường mới đang dần được xác định.
      </p>

      <button class="btn" id="level2Btn">
        BẮT ĐẦU LEVEL 02 →
      </button>

    </div>
  `;

  document.getElementById("level2Btn")
    .addEventListener("click", levelTwo);
}


let level2Matched = 0;
let level2Selected = null;
let level2Interval = null;
let level2Time = 45;
let level2BaseXP = 0;
let level2Active = false;


function levelTwo(resetBase = true){

  if(resetBase){
    level2BaseXP = xp;
  }

  hearts = 3;
  level2Matched = 0;
  level2Selected = null;
  level2Time = 45;
  level2Active = true;

  updateHUD();

  hud.style.display = "flex";

  document.querySelector("#hud .hudBlock:last-child")
    .firstChild.textContent = "LEVEL 2 / 5";

  document.getElementById("progress").style.width = "40%";

  screen.innerHTML = `
    <div class="content">

      <div class="level2Top">

        <div>
          <div class="mission">
            LEVEL 02 · BƯỚC NGOẶT
          </div>

          <div class="levelTitle">
            GIẢI MÃ <span class="red">1920</span>
          </div>
        </div>

        <div class="timerBox" id="timerBox">
          ⏱ <span id="level2Timer">45</span>s
        </div>

      </div>

      <p class="subtitle">
        Ghép mỗi khái niệm bên trái với ý nghĩa phù hợp bên phải.
        <br>
        Bạn có 45 giây và 3 lượt sai.
      </p>

      <div class="matchBoard">

        <div class="cardColumn">

          <div class="columnTitle">
            MẢNH GHÉP
          </div>

          <button class="conceptCard"
                  draggable="true"
                  data-match="theory">
            📜 Luận cương về vấn đề dân tộc và thuộc địa
          </button>

          <button class="conceptCard"
                  draggable="true"
                  data-match="path">
            🧭 Con đường cách mạng vô sản
          </button>

          <button class="conceptCard"
                  draggable="true"
                  data-match="tours">
            🏛 Đại hội Tours năm 1920
          </button>

        </div>


        <div class="slotColumn">

          <div class="columnTitle">
            VAI TRÒ / Ý NGHĨA
          </div>

          <button class="dropSlot"
                  data-match="path">
            Con đường giải phóng dân tộc được lựa chọn
          </button>

          <button class="dropSlot"
                  data-match="tours">
            Dấu mốc thể hiện lựa chọn chính trị quan trọng
          </button>

          <button class="dropSlot"
                  data-match="theory">
            Tài liệu tạo bước ngoặt trong nhận thức
          </button>

        </div>

      </div>

      <div class="level2Feedback" id="level2Feedback">
        Chọn một mảnh ghép rồi chọn ô tương ứng.
      </div>

    </div>
  `;

  setupLevel2();

  clearInterval(level2Interval);

  level2Interval = setInterval(function(){

    if(!level2Active) return;

    level2Time--;

    document.getElementById("level2Timer").textContent = level2Time;

    if(level2Time <= 10){
      document.getElementById("timerBox")
        .classList.add("timerDanger");
    }

    if(level2Time <= 0){

      clearInterval(level2Interval);

      level2Fail("HẾT THỜI GIAN");

    }

  },1000);
}


function setupLevel2(){

  const cards = document.querySelectorAll(".conceptCard");
  const slots = document.querySelectorAll(".dropSlot");

  cards.forEach(function(card){

    card.addEventListener("click",function(){

      cards.forEach(c => c.classList.remove("selected"));

      card.classList.add("selected");

      level2Selected = card;

      document.getElementById("level2Feedback").textContent =
        "Đã chọn mảnh ghép. Hãy chọn vị trí phù hợp.";

    });


    card.addEventListener("dragstart",function(e){

      e.dataTransfer.setData(
        "text/plain",
        card.dataset.match
      );

      level2Selected = card;

    });

  });


  slots.forEach(function(slot){

    slot.addEventListener("click",function(){

      if(!level2Selected){

        document.getElementById("level2Feedback").textContent =
          "Hãy chọn một mảnh ghép trước.";

        return;
      }

      checkLevel2Match(level2Selected,slot);

    });


    slot.addEventListener("dragover",function(e){
      e.preventDefault();
    });


    slot.addEventListener("drop",function(e){

      e.preventDefault();

      const match = e.dataTransfer.getData("text/plain");

      const card = [...document.querySelectorAll(".conceptCard")]
        .find(c => c.dataset.match === match);

      if(card){
        checkLevel2Match(card,slot);
      }

    });

  });
}


function checkLevel2Match(card,slot){

  if(!level2Active) return;

  if(card.dataset.match === slot.dataset.match){

    card.classList.remove("selected");

    card.classList.add("matched");

    slot.classList.add("matched");

    slot.innerHTML =
      "✓ " + slot.innerHTML;

    xp += 150;
    level2Matched++;

    updateHUD();

    document.getElementById("level2Feedback").innerHTML =
      `<span style="color:#8fb987">
      ✓ GHÉP CHÍNH XÁC &nbsp; +150 XP
      </span>`;

    level2Selected = null;

    if(level2Matched === 3){

      level2Active = false;

      clearInterval(level2Interval);

      setTimeout(level2Complete,800);

    }

  } else {

    hearts--;

    updateHUD();

    slot.classList.remove("wrong");

    void slot.offsetWidth;

    slot.classList.add("wrong");

    document.getElementById("level2Feedback").innerHTML =
      `<span style="color:#d45d58">
      ✕ Chưa đúng mối liên hệ. Hãy thử lại.
      </span>`;

    card.classList.remove("selected");

    level2Selected = null;

    if(hearts <= 0){

      clearInterval(level2Interval);

      level2Fail("BẠN ĐÃ HẾT 3 LƯỢT");

    }

  }
}


function level2Fail(reason){

  level2Active = false;

  clearInterval(level2Interval);

  screen.innerHTML = `
    <div class="content">

      <div class="small">
        LEVEL 02 · MISSION FAILED
      </div>

      <h1>
        ${reason}
      </h1>

      <p class="subtitle">
        Bước ngoặt năm 1920 vẫn chưa được giải mã.
        <br><br>
        Hãy thử lại nhiệm vụ.
      </p>

      <button class="btn" id="retryLevel2">
        THỬ LẠI LEVEL 02 →
      </button>

    </div>
  `;

  document.getElementById("retryLevel2")
    .addEventListener("click",function(){

      xp = level2BaseXP;

      updateHUD();

      levelTwo(false);

    });
}


function level2Complete(){

  level2Active = false;

  clearInterval(level2Interval);

  screen.innerHTML = `
    <div class="content">

      <div class="completeBox">

        <div class="small">
          LEVEL 02 COMPLETE
        </div>

        <h1>
          BƯỚC NGOẶT<br>
          <span class="red">1920</span>
        </h1>

        <div class="scoreBig">
          +450 XP
        </div>

        <p class="subtitle">
          Năm 1920 đánh dấu một bước chuyển quan trọng
          trong quá trình hình thành tư tưởng Hồ Chí Minh.
          <br><br>
          Từ quá trình tìm kiếm,
          một con đường giải phóng dân tộc mới
          dần được xác định.
        </p>

        <button class="btn" id="to1930">
          TIẾP TỤC ĐẾN 1930 →
        </button>

      </div>

    </div>
  `;

document.getElementById("to1930")
  .addEventListener("click", cinematic1930);
}

  hud.style.display = "none";

  screen.innerHTML = `
    <div class="content c1930">

      <div class="c1930Tag">
        CHƯƠNG 03 · KHỦNG HOẢNG & THỐNG NHẤT
      </div>

      <div class="c1930Title">
        TỪ <span class="red">PHÂN MẢNH</span><br>
        ĐẾN THỐNG NHẤT
      </div>

      <div class="c1930Sub">
        1929 → 1930
      </div>

      <div class="fractureScene">

        <div class="orgStream org1">
          ĐÔNG DƯƠNG<br>CỘNG SẢN ĐẢNG
        </div>

        </div>

       <div class="orgStream org3">
  <span>
    ĐÔNG DƯƠNG CỘNG SẢN<br>LIÊN ĐOÀN
  </span>

  <span class="lateJoin">
    GIA NHẬP SAU
  </span>
</div>

        <div class="unityCore">

trực tiếp tham dự;
<span class="gold">Đông Dương Cộng sản Liên đoàn gia nhập sau.</span>`;

  },4700);

  setTimeout(function(){

    text1930.innerHTML =
      `<span class="gold">
      Một tổ chức lãnh đạo thống nhất đã hình thành.
      </span>
      <br>
      Nhưng để dẫn dắt cách mạng,
      cần xác định đúng đường lối, lực lượng và mục tiêu.`;

  },6100);

  setTimeout(function(){

screen.insertAdjacentHTML("beforeend", `
      <button
        class="btn"
        id="enter1930Boss"

function setupPhase2(){

  const cards =
    document.querySelectorAll(
      ".fragmentCard"
    );


  const slots =
    document.querySelectorAll(
      ".strategySlot"
    );


  cards.forEach(function(card){


    card.addEventListener(
      "click",
      function(){

        cards.forEach(function(c){

          c.classList.remove(
            "selectedFragment"
          );

        });


        card.classList.add(
          "selectedFragment"
        );


        phase2Selected = card;


        document
          .getElementById(
            "phase2Feedback"
          )
          .textContent =
          "Mảnh tài liệu đã được chọn. Hãy đặt nó vào đúng khu vực.";

      }
    );


    card.addEventListener(
      "dragstart",
      function(e){

        e.dataTransfer.setData(
          "text/plain",
          card.dataset.id
        );


        phase2Selected = card;

      }
    );

  });


  slots.forEach(function(slot){


    slot.addEventListener(
      "click",
      function(){

        if(!phase2Selected){

          document
            .getElementById(
              "phase2Feedback"
            )
            .textContent =
            "Hãy chọn một mảnh tài liệu trước.";

          return;
        }


        checkPhase2Placement(
          phase2Selected,
          slot
        );

      }
    );


    slot.addEventListener(
      "dragover",
      function(e){

        e.preventDefault();

      }
    );


    slot.addEventListener(
      "drop",
      function(e){

        e.preventDefault();


        const id =
          e.dataTransfer.getData(
            "text/plain"
          );


        const card =
          [...document.querySelectorAll(
            ".fragmentCard"
          )]
          .find(function(c){

            return c.dataset.id === id;

          });


        if(card){

          checkPhase2Placement(
            card,
            slot
          );

        }

      }
    );

  });
}


function checkPhase2Placement(
  card,
  slot
){

  if(!phase2Active){
    return;
  }


  if(
    slot.classList.contains(
      "filledSlot"
    )
  ){
    return;
  }


  const target =
    card.dataset.target;


  const accept =
    slot.dataset.accept;


  const piece =
    phase2Pieces.find(
      function(p){

        return p.id ===
          card.dataset.id;

      }
    );


  if(target === accept){


    card.classList.remove(
      "selectedFragment"
    );


    card.classList.add(
      "lockedFragment"
    );


    phase2Selected = null;


    let reward = 150;


    if(accept === "noise"){

      reward = 75;

      phase2NoiseSolved++;


      const noiseStack =
        document.getElementById(
          "noiseStack"
        );


      noiseStack.insertAdjacentHTML(
        "beforeend",

        `
          <span class="noiseChip">
            MẢNH NHIỄU
            ${phase2NoiseSolved}/2
          </span>
        `
      );


      slot.querySelector(
        ".slotContent"
      ).textContent =
        `Đã loại ${phase2NoiseSolved}/2 mảnh sai.`;


      if(phase2NoiseSolved === 2){

        slot.classList.add(
          "completeNoise"
        );

        slot.classList.add(
          "filledSlot"
        );

function getLevel4MetricAverage(){

  const values =
    Object.values(
      level4Metrics
    );

  const total =
    values.reduce(
      function(sum,value){

        return sum + value;

      },
      0
    );

  return Math.round(
    total / values.length
  );

}


function level4NeedsRecovery(){

  const values =
    Object.values(
      level4Metrics
    );


  const criticalMetric =
    values.some(
      function(value){

        return value < 25;

      }
    );


  const average =
    getLevel4MetricAverage();


  return (
    criticalMetric ||
    average < 35
  );

}

/* ===== ANIMATE NUMBER ===== */

function animateLevel4Number(
  element,
  from,
  to,
  duration = 850
){

  const start =
    performance.now();


  function frame(now){

    const progress =
      Math.min(
        (now - start) / duration,
        1
      );


    const eased =
      1 -
      Math.pow(
        1 - progress,
        3
      );


    element.textContent =
      Math.round(
        from +
        (to - from) * eased
      );


    if(progress < 1){

      requestAnimationFrame(
        frame
      );

    }

  }


  requestAnimationFrame(
    frame
  );

}


/* ===== UPDATE VISUAL ===== */

function setLevel4MetricVisual(
  key,
  newValue,
  delta
){

  const value =
    document.getElementById(
      "level4Value-" + key
    );


  const fill =
    document.getElementById(
      "level4Fill-" + key
    );


  const card =
    document.getElementById(
      "level4Card-" + key
    );


  const deltaBox =
    document.getElementById(
      "level4Delta-" + key
    );


  if(
    !value ||
    !fill ||
    !card
  ){
    return;
  }


  const current =
    Number(
      value.textContent
    ) || 0;


  const safeValue =
    Math.max(
      0,
      Math.min(
        100,
        newValue
      )
    );


  fill.style.width =
    safeValue + "%";


  animateLevel4Number(
    value,
    current,
    safeValue
  );


  card.classList.remove(
    "boost"
  );


  void card.offsetWidth;


  card.classList.add(
    "boost"
  );


  setTimeout(
    function(){

      card.classList.remove(
        "boost"
      );

    },
    950
  );


  if(
    delta !== null &&
    delta !== 0 &&
    deltaBox
  ){

    deltaBox.textContent =
      delta > 0
      ? "+" + delta
      : delta;


    deltaBox.classList.remove(
      "show"
    );


    void deltaBox.offsetWidth;


    deltaBox.classList.add(
      "show"
    );

  }

}

/* ===== HANDLE DECISION ===== */

function handleLevel4Decision(
  crisisIndex,
  choiceIndex
){

  if(level4DecisionLocked) return;


  level4DecisionLocked =
    true;


  const crisis =
    level4Crises[
      crisisIndex
    ];


  const choice =
    crisis.choices[
      choiceIndex
    ];


  const firstResolution =
    !level4ResolvedCrises.has(
      crisis.id
    );


  const buttons =
    [
      ...document
        .querySelectorAll(
          ".level4DecisionChoice"
        )
    ];


  buttons.forEach(
    function(button){

      button.disabled =
        true;

    }
  );


  const selectedButton =
    buttons[
      choiceIndex
    ];


  const correctIndex =
    crisis.choices
      .findIndex(
        function(item){

          return item.correct;

        }
      );


  if(choice.correct){

    selectedButton
      .classList.add(
        "correctDecision"
      );

  }

  else{

    selectedButton
      .classList.add(
        "wrongDecision"
      );


    if(
      buttons[
        correctIndex
      ]
    ){

      buttons[
        correctIndex
      ]
      .classList.add(
        "answerReveal"
      );

    }

  }

  const foodVisual =
    document.getElementById(
      "level4FoodVisual"
    );


  const foodStatus =
    document.getElementById(
      "foodVisualStatus"
    );


  if(
    crisis.id === "food" &&
    foodVisual
  ){

    if(choice.correct){

      foodVisual
        .classList.add(
          "relief"
        );


      if(foodStatus){

        foodStatus.textContent =
          "RELIEF NETWORK ACTIVE · SUPPLY FLOW IMPROVING";

      }

    }

    else{

      foodVisual
        .classList.add(
          "supplyFailure"
        );


      if(foodStatus){

        foodStatus.textContent =
          "SUPPLY PRESSURE INCREASING";

      }

    }

  }

/* ===== APPLY EFFECTS ===== */

function applyLevel4DecisionEffects(
  effects
){

  Object
    .keys(effects)
    .forEach(
      function(key,index){

        setTimeout(
          function(){

            const delta =
              effects[key];


            level4Metrics[key] =
              Math.max(
                0,
                Math.min(
                  100,
                  level4Metrics[key]
                  + delta
                )
              );


            setLevel4MetricVisual(

              key,

              level4Metrics[key],

              delta

            );


            if(delta < 0){

              const card =
                document
                  .getElementById(
                    "level4Card-" + key
                  );


              if(card){

                card.classList.remove(
                  "boost"
                );

                void card.offsetWidth;

                card.classList.add(
                  "damage"
                );


                setTimeout(
                  function(){

                    card.classList.remove(
                      "damage"
                    );

                  },
                  600
                );

              }

            }

          },

          index * 180

        );

      }
    );

}


/* ===== EFFECT CHIPS ===== */

function getLevel4MetricName(
  key
){

  const item =
    level4MetricData
      .find(
        function(metric){

          return metric.key === key;

        }
      );


  return item
    ? item.name
    : key;

}

    title:"GIÁO DỤC · KHOA HỌC · CÔNG NGHỆ",

    body:`

      tiếp nối việc coi trọng

    `,

    question:
      "Hãy chọn chi tiết thể hiện giáo dục, nghiên cứu khoa học và công nghệ trong Việt Nam hiện đại."
  }

];


/* ===== BẮT ĐẦU TOPIC 04 ===== */

function startFinalTopic4(){

  finalTopic4Visited = new Set();

  finalTopic4QuizActive = false;

  finalTopic4QuizTarget = null;

  finalTopic4Complete = false;


  hud.style.display = "flex";


  document
    .getElementById("hearts")
    .style.visibility = "hidden";


  document
    .querySelector(
      "#hud .hudBlock:last-child"
    )
    .firstChild.textContent =
    "LEVEL 5 / 5";


  document
    .getElementById("progress")
    .style.width =
    "100%";


  renderFinalTopic4();
}


/* ===== HIỂN THỊ TOPIC 04 ===== */

function renderFinalTopic4(){

  screen.innerHTML = `

    <div class="content finalJourney">

      <div class="finalJourneyTop">

        <div class="finalJourneyHeading">

          <div class="small">
            FINAL JOURNEY · TOPIC 04
          </div>

          <div class="finalJourneyTitle">

            1969 → 2026<br>

            <span class="red">
              VẬN DỤNG · PHÁT TRIỂN · HỘI NHẬP
            </span>

          </div>

        </div>


        <div class="finalTopicProgress">

          KHÁM PHÁ

          <span id="finalTopic4ReadCount">
            ${finalTopic4Visited.size}
          </span>

          / 5

        </div>

      </div>


      <div class="finalTimeline">

        <div class="finalTimelineItem">
          1911–1930
        </div>

        <div class="finalTimelineItem">
          1945
        </div>

        <div class="finalTimelineItem">
          1954–1969
        </div>

          1969–2026
        </div>

      </div>


      <div
        class="finalSceneFrame"
        id="finalTopic4SceneFrame">

        <img
          class="finalSceneImage"
          src="topic4-1969-2026.png"
          alt="Việt Nam từ sau năm 1969 đến hiện đại">

        ${finalTopic4Points
          .map(function(point){

            return `
              <button
                class="
                  finalHotspot
                  ${
                    finalTopic4Visited.has(point.id)
                    ? "read"
                    : ""
                  }
                "

                data-final-topic4-point="${point.id}"

                style="
                  left:${point.x}%;
                  top:${point.y}%;
                "

                aria-label="${point.title}">
              </button>
            `;

          })
          .join("")
        }

      </div>


      <div class="finalDiscoverCount">

        <span>
          HỒ SƠ KIẾN THỨC · 1969–2026
        </span>

        <span id="finalTopic4DiscoverText">

          ${
            finalTopic4Visited.size < 5

            ?

            `ĐÃ KHÁM PHÁ ${finalTopic4Visited.size}/5`

            :

            "ĐỦ DỮ LIỆU"
          }

        </span>

      </div>


      <div
        class="finalKnowledgePanel"
        id="finalTopic4KnowledgePanel">

        <div class="finalKnowledgeLabel">
          FINAL DISCOVERY
        </div>

        <div class="finalKnowledgeTitle">
          CHẶNG CUỐI CỦA HÀNH TRÌNH
        </div>

        Quan sát bức ảnh và khám phá
        <strong class="gold">
          5 điểm kiến thức
        </strong>.

        <br><br>

        Chặng cuối kết nối
        lịch sử sau chiến tranh
        với quá trình Đổi mới,

      </div>


      <button

        id="finalTopic4MemoryBtn"

        style="
          display:
          ${
            finalTopic4Visited.size === 5
            ? "inline-block"
            : "none"
          };
        ">

        FINAL MEMORY CHECK →

      </button>

    </div>
  `;


  setupFinalTopic4();
}


/* ===== GẮN SỰ KIỆN HOTSPOT ===== */

function setupFinalTopic4(){

  document
    .querySelectorAll(
      "[data-final-topic4-point]"
    )
    .forEach(function(hotspot){

      hotspot.addEventListener(
        "click",
        function(){

          const id =
            hotspot.dataset.finalTopic4Point;

          handleFinalTopic4Point(
            id,
            hotspot
          );

        }
      );

    });


  const memoryBtn =
    document.getElementById(
      "finalTopic4MemoryBtn"
    );


  if(memoryBtn){

    memoryBtn.addEventListener(
      "click",
      startFinalTopic4MemoryCheck
    );

  }
}


/* ===== CLICK HOTSPOT ===== */

function handleFinalTopic4Point(
  id,
  hotspot
){

  const point =
    finalTopic4Points.find(
      function(item){
        return item.id === id;
      }
    );


  if(!point) return;


  if(finalTopic4QuizActive){

    checkFinalTopic4Answer(
      point,
      hotspot
    );

    return;
  }


  const isNew =
    !finalTopic4Visited.has(
      point.id
    );


 if(isNew){

  finalTopic4Visited.add(
    point.id
  );

if(
  isNew &&
  !finalJourneyCompleted.topic4
){
    xp += 50;

    updateHUD();

  }

  hotspot.classList.add(
    "read"
  );

}


  document
    .getElementById(
      "finalTopic4ReadCount"
    )
    .textContent =
    finalTopic4Visited.size;


  document
    .getElementById(
      "finalTopic4DiscoverText"
    )
    .textContent =

    finalTopic4Visited.size === 5

    ?

    "ĐỦ DỮ LIỆU"

    :

    `ĐÃ KHÁM PHÁ ${finalTopic4Visited.size}/5`;


  document
    .getElementById(
      "finalTopic4KnowledgePanel"
    )
    .innerHTML = `

      <div class="finalKnowledgeLabel">

        ${
        isNew && !finalJourneyCompleted.topic4
? "NEW DISCOVERY · +50 XP"
: "DISCOVERY REVIEW"
        }

      </div>

      <div class="finalKnowledgeTitle">
        ${point.title}
      </div>

      ${point.body}
    `;


  if(
    finalTopic4Visited.size ===
    finalTopic4Points.length
  ){

    document
      .getElementById(
        "finalTopic4MemoryBtn"
      )
      .style.display =
      "inline-block";

  }
}


/* ===== FINAL MEMORY CHECK ===== */

function startFinalTopic4MemoryCheck(){

  finalTopic4QuizActive =
    true;


  finalTopic4QuizTarget =

    finalTopic4Points[
      Math.floor(
        Math.random()
        *
        finalTopic4Points.length
      )
    ];


  document
    .getElementById(
      "finalTopic4MemoryBtn"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "finalTopic4KnowledgePanel"
    )
    .innerHTML = `

      <div class="finalKnowledgeLabel">
        FINAL MEMORY CHECK
      </div>

      <div class="finalQuizQuestion">
        ${finalTopic4QuizTarget.question}
      </div>

      <div class="finalQuizHint">

        Không có A / B / C.

        <br><br>

        Hãy bấm trực tiếp
        vào chi tiết đúng
        trên bức ảnh.

      </div>

    `;
}


/* ===== KIỂM TRA ĐÁP ÁN ===== */

function checkFinalTopic4Answer(
  selectedPoint,
  hotspot
){

  if(
    selectedPoint.id ===
    finalTopic4QuizTarget.id
  ){

    completeFinalTopic4();

    return;
  }


  hotspot.classList.remove(
    "finalWrong"
  );


  void hotspot.offsetWidth;


  hotspot.classList.add(
    "finalWrong"
  );


  document
    .getElementById(
      "finalTopic4KnowledgePanel"
    )
    .innerHTML = `

      <div
        class="finalKnowledgeLabel"
        style="color:#d86661">

        FINAL MEMORY CHECK · CHƯA ĐÚNG

      </div>

      <div class="finalQuizQuestion">
        ${finalTopic4QuizTarget.question}
      </div>

      <div class="finalQuizHint">

        Chi tiết vừa chọn chưa đúng.

        <br><br>

        Hãy quan sát lại
        và thử một vị trí khác.

      </div>

    `;
}


/* ===== TOPIC 04 COMPLETE ===== */

function completeFinalTopic4(){

  if(finalTopic4Complete) return;

  finalTopic4Complete = true;
  finalTopic4QuizActive = false;

  if(!finalJourneyCompleted.topic4){

    finalJourneyCompleted.topic4 = true;

    xp += 250;

    updateHUD();
  }


  document
    .getElementById(
      "finalTopic4KnowledgePanel"
    )
    .innerHTML = `

      <div class="finalSuccess">

        <div class="finalSuccessStamp">
          TOPIC 04 COMPLETE
        </div>

        <div class="finalKnowledgeTitle">
          1969 → 2026
        </div>

        Bạn đã hoàn thành
        hồ sơ kiến thức thứ tư.

        <br><br>

        <strong class="gold">
          MEMORY CHECK PASSED · +250 XP
        </strong>

        <br><br>

        <button
          class="btn"
          id="returnFinalHub4">

          TRỞ VỀ HÀNH TRÌNH →

        </button>

      </div>
    `;


  document
    .getElementById(
      "returnFinalHub4"
    )
    .addEventListener(
      "click",
      renderFinalJourneyHub
    );
}
