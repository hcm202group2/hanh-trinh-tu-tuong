<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hành Trình Tư Tưởng</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:radial-gradient(circle at center,#351414 0%,#150909 55%,#070404 100%);
  color:#f3eadb;
  min-height:100vh;
}

#game{
  min-height:100vh;
  position:relative;
  overflow:hidden;
}

.noise{
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.07;
  background-image:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(255,255,255,.05) 3px
  );
}

.screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:90px 24px 60px;
  animation:appear .8s ease;
}

.content{
  width:min(950px,100%);
}

.small{
  letter-spacing:6px;
  font-size:13px;
  color:#c8a45c;
  margin-bottom:22px;
}

h1{
  font-size:clamp(45px,8vw,90px);
  line-height:.95;
  margin-bottom:25px;
}

.red{color:#b83b38}
.gold{color:#c8a45c}

.subtitle{
  max-width:700px;
  margin:0 auto 35px;
  color:#c8beb1;
  font-size:18px;
  line-height:1.7;
}

.btn{
  border:1px solid #c8a45c;
  background:transparent;
  color:#f5ead5;
  padding:16px 30px;
  font-size:14px;
  letter-spacing:2px;
  cursor:pointer;
  transition:.25s;
}

.btn:hover{
  background:#c8a45c;
  color:#160909;
  transform:translateY(-3px);
}

/* HUD */
#hud{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  padding:18px 28px;
  display:none;
  justify-content:space-between;
  align-items:center;
  z-index:20;
  background:rgba(8,4,4,.8);
  border-bottom:1px solid rgba(200,164,92,.25);
  backdrop-filter:blur(8px);
}

.hudBlock{
  font-size:13px;
  letter-spacing:2px;
}

#hearts{color:#d95550;font-size:20px}

.progressWrap{
  width:180px;
  height:5px;
  background:#332727;
  margin-top:8px;
}

#progress{
  width:20%;
  height:100%;
  background:#c8a45c;
}

/* LEVEL 1 */
.levelTitle{
  font-size:clamp(32px,6vw,65px);
  margin-bottom:10px;
}

.mission{
  color:#c8a45c;
  letter-spacing:3px;
  font-size:13px;
  margin-bottom:12px;
}

.objects{
  margin:38px auto 25px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  max-width:760px;
}

.object{
  min-height:145px;
  border:1px solid rgba(200,164,92,.25);
  background:rgba(255,255,255,.035);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.25s;
  padding:18px;
}

.object:hover{
  transform:translateY(-6px);
  border-color:#c8a45c;
  background:rgba(200,164,92,.08);
}

.object .icon{
  font-size:48px;
  margin-bottom:12px;
}

.object .label{
  font-size:12px;
  letter-spacing:2px;
  color:#a99f91;
}

.object.correct-found{
  border-color:#7aaa72;
  background:rgba(70,120,60,.12);
  opacity:.55;
  pointer-events:none;
}

.object.wrong{
  animation:shake .35s;
  border-color:#b83b38;
}

#message{
  min-height:35px;
  margin-top:20px;
  font-size:15px;
  letter-spacing:1px;
  color:#d8c9b4;
}

.completeBox{
  padding:45px 25px;
  border:1px solid rgba(200,164,92,.4);
  background:rgba(255,255,255,.025);
  max-width:700px;
  margin:auto;
}

.scoreBig{
  font-size:70px;
  color:#c8a45c;
  margin:15px 0;
  font-weight:bold;
}

@keyframes appear{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-8px)}
  75%{transform:translateX(8px)}
}
/* ===== CINEMATIC 1911 → 1920 ===== */

.cinematic{
  position:relative;
  width:min(1000px,100%);
  min-height:520px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  overflow:hidden;
}

.cineTitle{
  font-size:13px;
  letter-spacing:7px;
  color:#c8a45c;
  margin-bottom:45px;
}

.timelineScene{
  position:relative;
  width:85%;
  max-width:850px;
  height:180px;
  margin:auto;
}

.timelineBase{
  position:absolute;
  left:0;
  right:0;
  top:90px;
  height:2px;
  background:#352929;
}

.timelineFill{
  position:absolute;
  left:0;
  top:90px;
  height:2px;
  width:0;
  background:#c8a45c;
  animation:growTimeline 5.5s ease forwards;
}

.yearPoint{
  position:absolute;
  top:82px;
  width:18px;
  height:18px;
  border-radius:50%;
  border:2px solid #62513a;
  background:#150909;
  transform:translateX(-50%);
}

.yearPoint::after{
  content:attr(data-year);
  position:absolute;
  top:32px;
  left:50%;
  transform:translateX(-50%);
  font-size:14px;
  letter-spacing:3px;
  color:#837569;
}

.p1911{
  left:5%;
  animation:unlockPoint .5s .4s forwards;
}

.p1919{
  left:55%;
  animation:unlockPoint .5s 3s forwards;
}

.p1920{
  left:95%;
  animation:unlockPoint .5s 5.2s forwards;
}

.ship{
  position:absolute;
  top:25px;
  left:1%;
  font-size:48px;
  animation:shipJourney 5.5s ease-in-out forwards;
}

.cineText{
  min-height:80px;
  margin-top:25px;
  font-size:18px;
  line-height:1.7;
  color:#c8beb1;
  transition:.4s;
}

#cineContinue{
  opacity:0;
  pointer-events:none;
  margin-top:20px;
  animation:showContinue .8s 6.2s forwards;
}

@keyframes growTimeline{
  from{width:0}
  to{width:100%}
}

@keyframes shipJourney{
  0%{
    left:1%;
    transform:translateY(0) rotate(-2deg);
  }

  35%{
    transform:translateY(-8px) rotate(2deg);
  }

  65%{
    transform:translateY(5px) rotate(-1deg);
  }

  100%{
    left:90%;
    transform:translateY(0);
  }
}

@keyframes unlockPoint{
  to{
    background:#c8a45c;
    border-color:#f1d28e;
    box-shadow:0 0 20px rgba(200,164,92,.8);
  }
}

@keyframes showContinue{
  to{
    opacity:1;
    pointer-events:auto;
  }
}

@media(max-width:650px){
  .objects{grid-template-columns:repeat(2,1fr)}
  #hud{padding:14px 12px}
  .progressWrap{width:90px}
  .hudBlock{font-size:10px}
}
  /* ===== LEVEL 2 PREMIUM UI ===== */

.level2Top{
  width:min(900px,100%);
  margin:0 auto 15px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:30px;
}
.timerBox{
  flex-shrink:0;
  padding:12px 20px;
  border:1px solid rgba(200,164,92,.45);
  background:rgba(200,164,92,.07);
  color:#d9b96e;
  border-radius:8px;
  font-size:16px;
  letter-spacing:2px;
}

.matchBoard{
  width:min(900px,100%);
  margin:30px auto 0;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:28px;
}

.cardColumn,
.slotColumn{
  display:flex;
  flex-direction:column;
  gap:14px;

  padding:22px;
  border:1px solid rgba(200,164,92,.16);
  background:rgba(255,255,255,.025);
  border-radius:12px;
}

.columnTitle{
  margin-bottom:8px;
  color:#c8a45c;
  font-size:12px;
  letter-spacing:4px;
  text-align:left;
}

/* XÓA HOÀN TOÀN GIAO DIỆN BUTTON MẶC ĐỊNH */

button.conceptCard,
button.dropSlot{
  appearance:none;
  -webkit-appearance:none;

  display:flex;
  align-items:center;

  width:100%;
  min-height:82px;

  padding:16px 18px;

  border-radius:9px;
  border:1px solid rgba(200,164,92,.22);

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.018)
    );

  color:#eadfce;

  font-family:Arial,sans-serif;
  font-size:15px;
  line-height:1.45;
  text-align:left;

  cursor:pointer;

  transition:
    transform .22s ease,
    border-color .22s ease,
    background .22s ease,
    box-shadow .22s ease;
}

button.conceptCard:hover,
button.dropSlot:hover{
  transform:translateY(-3px);
  border-color:#c8a45c;
  background:rgba(200,164,92,.08);
}

button.conceptCard.selected{
  border-color:#d4ad58;

  background:
    linear-gradient(
      135deg,
      rgba(200,164,92,.18),
      rgba(200,164,92,.06)
    );

  box-shadow:
    0 0 0 1px rgba(200,164,92,.15),
    0 8px 30px rgba(0,0,0,.25);

  transform:translateX(7px);
}

button.dropSlot{
  border-style:dashed;
  color:#bdb1a1;
  background:rgba(0,0,0,.13);
}

button.conceptCard.matched,
button.dropSlot.matched{
  border-style:solid;
  border-color:#6f9f68;

  background:
    linear-gradient(
      135deg,
      rgba(74,120,67,.22),
      rgba(74,120,67,.08)
    );

  color:#a9d3a4;

  pointer-events:none;
}

.level2Feedback{
  width:min(900px,100%);
  min-height:48px;

  margin:22px auto 0;
  padding:13px 18px;

  border-top:1px solid rgba(200,164,92,.15);

  color:#c8beb1;

  font-size:15px;
  letter-spacing:.5px;
}

.timerDanger{
  color:#e06460 !important;
  border-color:#b83b38 !important;

  box-shadow:
    0 0 20px rgba(184,59,56,.25);

  animation:timerPulse .7s infinite alternate;
}

@keyframes timerPulse{
  from{
    transform:scale(1);
  }

  to{
    transform:scale(1.06);
  }
}

@media(max-width:750px){

  .matchBoard{
    grid-template-columns:1fr;
  }

  .level2Top{
    align-items:center;
    flex-direction:column;
  }

  button.conceptCard,
  button.dropSlot{
    min-height:70px;
  }
}
  /* ===== CINEMATIC 1930 ===== */

.c1930{
  position:relative;
  width:min(1000px,100%);
  min-height:620px;
  overflow:hidden;
}

.c1930Tag{
  color:#c8a45c;
  letter-spacing:7px;
  font-size:12px;
  margin-bottom:20px;
}

.c1930Title{
  font-size:clamp(42px,7vw,82px);
  line-height:1;
  margin-bottom:18px;
}

.c1930Sub{
  color:#a99f91;
  font-size:15px;
  letter-spacing:2px;
  margin-bottom:35px;
}

.fractureScene{
  position:relative;
  width:min(900px,100%);
  height:250px;
  margin:0 auto;
}

.orgStream{
  position:absolute;
  z-index:2;
  width:230px;
  min-height:58px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:12px 16px;

  border:1px solid rgba(184,59,56,.45);
  background:rgba(184,59,56,.08);

  color:#e7d9c8;

  font-size:12px;
  line-height:1.4;
  letter-spacing:1px;

  box-shadow:
    0 0 20px rgba(184,59,56,.08);

  opacity:0;
}

.org1{
  left:0;
  top:15px;
  animation:orgEnterLeft .7s .5s forwards;
}

.org2{
  right:0;
  top:90px;
  animation:orgEnterRight .7s 1.1s forwards;
}

.org3{
  left:40px;
  bottom:10px;
  animation:orgEnterLeft .7s 1.7s forwards;

  flex-direction:column;
  gap:6px;

  border-style:dashed;
  border-color:rgba(200,164,92,.28);

  color:#93877c;
  background:rgba(200,164,92,.025);
}

.org3 .lateJoin{
  color:#c8a45c;
  font-size:9px;
  letter-spacing:2px;
}

.unityCore{
  z-index:3;
  position:absolute;

  left:50%;
  top:50%;

  width:105px;
  height:105px;

  transform:translate(-50%,-50%) scale(.3);

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  border:1px solid rgba(200,164,92,.8);

  background:
    radial-gradient(
      circle,
      rgba(200,164,92,.28),
      rgba(200,164,92,.03)
    );

  color:#e9c978;

  font-size:13px;
  letter-spacing:3px;

  opacity:0;

  animation:coreAwake .8s 3.2s forwards;
}


}
.c1930Text{
  min-height:70px;

  width:min(760px,100%);
  margin:18px auto 0;

  color:#c8beb1;

  font-size:18px;
  line-height:1.65;

  transition:.35s;
}

.c1930Stamp{
  margin:25px auto 0;

  width:max-content;

  padding:13px 25px;

  border:3px solid #b83b38;

  color:#d6605c;

  font-weight:bold;
  letter-spacing:5px;

  transform:rotate(-5deg) scale(2.2);

  opacity:0;

  animation:stamp1930 .35s 5.7s forwards;
}

@keyframes orgEnterLeft{
  from{
    opacity:0;
    transform:translateX(-60px);
  }

  to{
    opacity:1;
    transform:translateX(0);
  }
}

@keyframes orgEnterRight{
  from{
    opacity:0;
    transform:translateX(60px);
  }

  to{
    opacity:1;
    transform:translateX(0);
  }
}

@keyframes coreAwake{
  to{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
    box-shadow:
      0 0 20px rgba(200,164,92,.35),
      0 0 60px rgba(200,164,92,.15);
  }
}

@keyframes lineGrow{
  from{
    width:0;
    opacity:0;
  }

  to{
    width:var(--line-length,230px);
    opacity:1;
  }
}

@keyframes stamp1930{
  0%{
    opacity:0;
    transform:rotate(-5deg) scale(2.2);
  }

  70%{
    opacity:1;
    transform:rotate(-5deg) scale(.9);
  }

  100%{
    opacity:1;
    transform:rotate(-5deg) scale(1);
  }
}

@media(max-width:750px){

  .fractureScene{
    height:330px;
  }

  .orgStream{
    width:180px;
    font-size:10px;
  }

  .org1{
    top:0;
  }

  .org2{
    top:110px;
  }

  .org3{
    bottom:0;
  }

  .unityLine{
    display:none;
  }
}

/* ===== ARCHIVE SVG STYLE ===== */

.svgInk{
  fill:#b9aa91;
}

.svgDark{
  fill:#332722;
}

.svgLine{
  stroke:#b6a585;
  stroke-width:3;
  fill:none;
}

.svgThin{
  stroke:#7d6f5d;
  stroke-width:2;
  fill:none;
}

.svgRed{
  fill:#8e3431;
}

.svgPaper{
  fill:#b9aa87;
}

.svgPaperLine{
  stroke:#59493d;
  stroke-width:3;
}

  /* ==================================================
   LEVEL 3 · REVOLUTION NETWORK · NEW
================================================== */

.l3nWrap{
  width:min(1120px,100%);
  margin:auto;
}

.l3nHeader{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:28px;
  margin-bottom:22px;
}

.l3nHeaderText{
  text-align:left;
}

.l3nKicker{
  margin-bottom:8px;
  color:#c8a45c;
  font-size:11px;
  letter-spacing:5px;
}

.l3nTitle{
  font-size:clamp(34px,5.5vw,66px);
  line-height:1;
}

.l3nStatus{
  min-width:190px;
  padding:13px 16px;
  border:1px solid rgba(200,164,92,.28);
  border-radius:8px;
  background:rgba(200,164,92,.045);
  text-align:right;
}

.l3nStatusLabel{
  margin-bottom:7px;
  color:#807468;
  font-size:9px;
  letter-spacing:3px;
}

.l3nStatusValue{
  color:#d7bb74;
  font-size:13px;
  letter-spacing:2px;
}


/* ===== STAGE RAIL ===== */

.l3nStageRail{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:18px;
}

.l3nStageChip{
  padding:10px 12px;
  border-bottom:2px solid #352826;
  color:#675d55;
  font-size:10px;
  letter-spacing:2px;
  transition:.3s;
}

.l3nStageChip.active{
  border-color:#c8a45c;
  color:#d9bd77;
}

.l3nStageChip.done{
  border-color:#6f9f68;
  color:#91bb89;
}


/* ===== NETWORK BOARD ===== */

.l3nBoard{
  position:relative;
  overflow:hidden;
  padding:26px;
  border:1px solid rgba(200,164,92,.18);
  border-radius:15px;

  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(146,44,40,.13),
      transparent 38%
    ),
    linear-gradient(
      145deg,
      rgba(255,255,255,.025),
      rgba(0,0,0,.14)
    );

  box-shadow:
    0 25px 80px rgba(0,0,0,.28);
}

.l3nBoard::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;

  background:
    linear-gradient(
      rgba(200,164,92,.018) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(200,164,92,.018) 1px,
      transparent 1px
    );

  background-size:36px 36px;
}

.l3nCore{
  position:relative;
  z-index:2;

  width:150px;
  height:150px;

  margin:0 auto 24px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  border:1px solid rgba(200,164,92,.55);
  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(200,164,92,.14),
      rgba(40,10,10,.42)
    );

  box-shadow:
    0 0 35px rgba(200,164,92,.08);
}

.l3nCoreYear{
  color:#c8a45c;
  font-size:30px;
  font-weight:bold;
}

.l3nCoreText{
  margin-top:6px;
  color:#908276;
  font-size:9px;
  letter-spacing:2px;
}

.l3nCore.online{
  border-color:#77a771;

  box-shadow:
    0 0 25px rgba(80,140,70,.16),
    0 0 70px rgba(200,164,92,.08);
}


/* ===== INSTRUCTION ===== */

.l3nInstruction{
  position:relative;
  z-index:2;

  max-width:760px;
  margin:0 auto 22px;

  color:#b8ac9f;
  font-size:14px;
  line-height:1.65;
}


/* ===== STAGE 1 · UNIFICATION ===== */

.l3nCardGrid{
  position:relative;
  z-index:2;

  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.l3nCard{
  appearance:none;
  -webkit-appearance:none;

  min-height:105px;
  padding:16px;

  border:1px solid rgba(184,59,56,.28);
  border-radius:10px;

  background:rgba(184,59,56,.035);

  color:#dfd2c3;
  font-family:Arial,sans-serif;
  font-size:12px;
  line-height:1.5;
  letter-spacing:1px;

  cursor:pointer;

  transition:.22s;
}

.l3nCard:hover{
  transform:translateY(-4px);
  border-color:#c8a45c;
}

.l3nCard.active{
  border-color:#c8a45c;
  background:rgba(200,164,92,.12);

  box-shadow:
    0 0 22px rgba(200,164,92,.1);
}

.l3nCard.done{
  border-color:#6f9f68;
  background:rgba(70,120,60,.12);
  color:#9ec598;
  pointer-events:none;
}

.l3nRouteGrid{
  position:relative;
  z-index:2;

  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;

  width:min(760px,100%);
  margin:18px auto 0;
}

.l3nRoute{
  appearance:none;
  -webkit-appearance:none;

  padding:16px;

  border:1px dashed rgba(200,164,92,.32);
  border-radius:9px;

  background:rgba(0,0,0,.12);

  color:#d3c6b5;
  font-family:Arial,sans-serif;
  font-size:11px;
  letter-spacing:2px;

  cursor:pointer;
  transition:.22s;
}

.l3nRoute:hover{
  border-color:#c8a45c;
  background:rgba(200,164,92,.07);
}


/* ===== STAGE 2 · SIGNAL ROUTING ===== */

.l3nSignalLayout{
  position:relative;
  z-index:2;

  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:20px;
}

.l3nSignalList{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.l3nSignal{
  appearance:none;
  -webkit-appearance:none;

  width:100%;
  padding:13px 15px;

  border:1px solid rgba(200,164,92,.16);
  border-radius:8px;

  background:rgba(255,255,255,.025);

  color:#d9cdbf;
  font-family:Arial,sans-serif;
  font-size:12px;
  line-height:1.45;
  text-align:left;

  cursor:pointer;
  transition:.2s;
}

.l3nSignal:hover{
  transform:translateX(5px);
  border-color:#c8a45c;
}

.l3nSignal.selected{
  border-color:#d0ad5d;
  background:rgba(200,164,92,.11);
}

.l3nSignal.done{
  opacity:.32;
  pointer-events:none;
}

.l3nNodeGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.l3nNode{
  appearance:none;
  -webkit-appearance:none;

  min-height:83px;
  padding:12px;

  border:1px dashed rgba(200,164,92,.25);
  border-radius:9px;

  background:rgba(0,0,0,.14);

  color:#a99c8e;
  font-family:Arial,sans-serif;
  font-size:10px;
  line-height:1.4;
  letter-spacing:1px;

  cursor:pointer;
  transition:.2s;
}

.l3nNode:hover{
  border-color:#c8a45c;
}

.l3nNode.done{
  border-style:solid;
  border-color:#6f9f68;

  background:
    linear-gradient(
      135deg,
      rgba(70,120,60,.17),
      rgba(70,120,60,.045)
    );

  color:#9dc497;
}


/* ===== STAGE 3 · NETWORK SYNCHRONIZATION ===== */

#l3nRoot[data-l3n-stage="3"]
.l3nBoard > .l3nCore{
  display:none;
}

.l3nSyncArena{
  position:relative;
  z-index:2;

  width:min(920px,100%);
  min-height:390px;

  margin:4px auto 24px;
  padding:18px;

  display:grid;
  grid-template-columns:
    minmax(190px,1fr)
    150px
    minmax(190px,1fr);
  grid-template-rows:
    122px
    122px
    122px;
  gap:8px 22px;

  border:1px solid rgba(111,159,104,.16);
  border-radius:14px;

  background:
    radial-gradient(
      circle at center,
      rgba(111,159,104,.08),
      transparent 34%
    ),
    linear-gradient(
      145deg,
      rgba(255,255,255,.018),
      rgba(0,0,0,.12)
    );

  overflow:hidden;
}

.l3nSyncArena::before{
  content:"SYNC MATRIX · 4 NODES / 8 SIGNALS";

  position:absolute;
  left:16px;
  top:12px;

  color:#665f56;
  font-size:8px;
  letter-spacing:2.2px;
}

.l3nSyncLines{
  position:absolute;
  inset:0;
  z-index:0;

  width:100%;
  height:100%;

  pointer-events:none;
}

.l3nSyncLine{
  stroke:rgba(111,159,104,.13);
  stroke-width:1.2;
  stroke-dasharray:3 3;
  vector-effect:non-scaling-stroke;

  transition:
    stroke .35s ease,
    filter .35s ease,
    opacity .35s ease;
}

.l3nSyncLine.active{
  stroke:rgba(200,164,92,.58);
  stroke-dasharray:0;
}

.l3nSyncLine.done{
  stroke:#78a471;
  stroke-width:1.8;
  filter:drop-shadow(0 0 4px rgba(111,159,104,.7));
}

.l3nSyncNode{
  appearance:none;
  -webkit-appearance:none;

  position:relative;
  z-index:2;

  width:100%;
  min-height:108px;

  padding:14px;

  border:1px dashed rgba(200,164,92,.22);
  border-radius:10px;

  background:
    linear-gradient(
      145deg,
      rgba(8,5,5,.84),
      rgba(200,164,92,.025)
    );

  color:#b7aa9d;
  font-family:Arial,sans-serif;
  text-align:left;

  cursor:pointer;

  transition:
    transform .22s ease,
    border-color .22s ease,
    background .22s ease,
    box-shadow .22s ease;
}

.l3nSyncNode.nw{grid-column:1;grid-row:1;}
.l3nSyncNode.ne{grid-column:3;grid-row:1;}
.l3nSyncNode.sw{grid-column:1;grid-row:3;}
.l3nSyncNode.se{grid-column:3;grid-row:3;}

.l3nSyncNode:hover:not(:disabled){
  transform:translateY(-3px);
  border-color:rgba(200,164,92,.66);

  box-shadow:
    0 14px 32px rgba(0,0,0,.22),
    0 0 20px rgba(200,164,92,.06);
}

.l3nSyncNode.primed{
  border-style:solid;
  border-color:rgba(200,164,92,.58);

  background:
    linear-gradient(
      145deg,
      rgba(200,164,92,.075),
      rgba(8,5,5,.76)
    );
}

.l3nSyncNode.done{
  border-style:solid;
  border-color:rgba(111,159,104,.75);

  background:
    linear-gradient(
      145deg,
      rgba(70,120,60,.15),
      rgba(8,5,5,.72)
    );

  box-shadow:
    0 0 24px rgba(111,159,104,.08);

  cursor:default;
}

.l3nSyncNodeTop{
  display:flex;
  justify-content:space-between;
  gap:10px;

  margin-bottom:9px;
}

.l3nSyncNodeCode,
.l3nSyncNodeState{
  font-size:8px;
  letter-spacing:2px;
}

.l3nSyncNodeCode{color:#7c7166;}
.l3nSyncNodeState{color:#a18a55;}
.l3nSyncNode.done .l3nSyncNodeState{color:#8fc187;}

.l3nSyncNodeCue{
  color:#ddd0c0;
  font-size:11px;
  letter-spacing:1.6px;
  line-height:1.35;
}

.l3nSyncSlots{
  display:flex;
  gap:7px;

  margin-top:10px;
}

.l3nSyncSlot{
  min-width:46px;
  padding:4px 7px;

  border:1px solid rgba(200,164,92,.12);
  border-radius:4px;

  color:#5f574f;
  font-size:8px;
  letter-spacing:1px;
  text-align:center;
}

.l3nSyncSlot.filled{
  border-color:rgba(200,164,92,.42);
  color:#d2b568;
  background:rgba(200,164,92,.055);
}

.l3nSyncNode.done .l3nSyncSlot.filled{
  border-color:rgba(111,159,104,.55);
  color:#93be8c;
  background:rgba(111,159,104,.07);
}

.l3nSyncNodeResult{
  margin-top:8px;

  color:#6f665e;
  font-size:8px;
  letter-spacing:1.5px;
}

.l3nSyncNode.done .l3nSyncNodeResult{
  color:#9ac493;
}

.l3nSyncCore{
  position:relative;
  z-index:3;

  grid-column:2;
  grid-row:2;

  width:118px;
  height:118px;

  place-self:center;

  padding:3px;

  border-radius:50%;

  background:
    conic-gradient(
      #7aa473 var(--sync-angle),
      rgba(111,159,104,.10) 0
    );

  box-shadow:
    0 0 38px rgba(111,159,104,.09);
}

.l3nSyncCoreInner{
  width:100%;
  height:100%;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  border:1px solid rgba(200,164,92,.38);
  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(200,164,92,.12),
      #160d0b 70%
    );

  text-align:center;
}

.l3nSyncCore strong{
  color:#d2ad55;
  font-size:25px;
}

.l3nSyncCore span{
  margin-top:4px;

  color:#8d8175;
  font-size:7px;
  letter-spacing:1.6px;
}

.l3nSyncCore small{
  margin-top:8px;

  color:#8fb888;
  font-size:7px;
  letter-spacing:1.2px;
}

.l3nFragmentHeader{
  position:relative;
  z-index:2;

  width:min(920px,100%);
  margin:0 auto 9px;

  display:flex;
  justify-content:space-between;
  gap:12px;

  color:#776c61;
  font-size:8px;
  letter-spacing:2px;
}

.l3nFragmentHeader strong{
  color:#a68e55;
  font-weight:normal;
}

.l3nFragmentGrid{
  position:relative;
  z-index:2;

  width:min(920px,100%);
  margin:auto;

  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.l3nFragment{
  appearance:none;
  -webkit-appearance:none;

  display:grid;
  grid-template-columns:58px 1fr auto;
  align-items:center;
  gap:10px;

  min-height:58px;
  padding:10px 12px;

  border:1px solid rgba(200,164,92,.14);
  border-radius:8px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.026),
      rgba(7,4,4,.30)
    );

  color:#d1c5b6;
  font-family:Arial,sans-serif;
  text-align:left;

  cursor:pointer;

  transition:
    transform .2s ease,
    border-color .2s ease,
    background .2s ease,
    opacity .2s ease,
    box-shadow .2s ease;
}

.l3nFragment:hover:not(:disabled){
  transform:translateX(4px);
  border-color:rgba(200,164,92,.54);
}

.l3nFragment.selected{
  border-color:#d0ad5d;
  background:rgba(200,164,92,.10);

  box-shadow:
    0 0 0 1px rgba(200,164,92,.06),
    0 9px 25px rgba(0,0,0,.16);
}

.l3nFragment.linked{
  opacity:.34;
  border-color:rgba(111,159,104,.28);
  cursor:default;
}

.l3nFragmentCode{
  color:#c2a45c;
  font-size:9px;
  font-weight:bold;
  letter-spacing:1px;
}

.l3nFragmentText{
  font-size:11px;
  line-height:1.45;
}

.l3nFragmentState{
  color:#625a52;
  font-size:7px;
  letter-spacing:1.4px;
}

.l3nFragment.selected .l3nFragmentState{
  color:#d3b560;
}

.l3nFragment.linked .l3nFragmentState{
  color:#86ad80;
}

.l3nSyncNode:focus-visible,
.l3nFragment:focus-visible{
  outline:2px solid #e0bd68;
  outline-offset:3px;
}

@media(max-width:780px){

  .l3nSyncArena{
    min-height:0;

    grid-template-columns:1fr;
    grid-template-rows:auto;
    gap:9px;

    padding:34px 12px 12px;
  }

  .l3nSyncLines{
    display:none;
  }

  .l3nSyncNode,
  .l3nSyncCore{
    grid-column:1 !important;
    grid-row:auto !important;
  }

  .l3nSyncCore{
    order:-1;
    margin-bottom:8px;
  }

  .l3nFragmentGrid{
    grid-template-columns:1fr;
  }

  .l3nFragment{
    grid-template-columns:54px 1fr;
  }

  .l3nFragmentState{
    display:none;
  }

}
/* ===== FEEDBACK / PROGRESS ===== */

.l3nFeedback{
  position:relative;
  z-index:2;

  min-height:72px;

  margin-top:18px;
  padding:14px 17px;

  border-left:2px solid #c8a45c;

  background:rgba(200,164,92,.035);

  color:#bdb1a3;

  font-size:13px;
  line-height:1.65;
  text-align:left;
}

.l3nFeedback.error{
  border-color:#b83b38;
  color:#d07874;
}

.l3nFeedback.success{
  border-color:#6f9f68;
  color:#9fc895;
}

.l3nMeter{
  position:relative;
  z-index:2;

  width:100%;
  height:6px;

  margin-top:18px;

  overflow:hidden;
  border-radius:20px;

  background:#302321;
}

.l3nMeterFill{
  width:0%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      #8e302d,
      #c8a45c,
      #739c6d
    );

  transition:width .45s ease;
}

.l3nFooter{
  position:relative;
  z-index:2;

  margin-top:18px;
  text-align:center;
}

.l3nComplete{
  max-width:760px;
  margin:auto;

  padding:35px 25px;

  border:1px solid rgba(200,164,92,.3);
  border-radius:13px;

  background:
    radial-gradient(
      circle at top,
      rgba(200,164,92,.08),
      rgba(255,255,255,.015)
    );
}

.l3nCompleteStamp{
  width:max-content;
  margin:20px auto;

  padding:11px 20px;

  border:2px solid #739c6d;

  color:#92be8b;

  font-weight:bold;
  letter-spacing:4px;

  transform:rotate(-2deg);
}


/* ===== WRONG FEEDBACK ===== */

.l3nWrong{
  animation:l3nShake .32s;
  border-color:#b83b38 !important;
}

@keyframes l3nShake{

  0%,100%{
    transform:translateX(0);
  }

  25%{
    transform:translateX(-6px);
  }

  75%{
    transform:translateX(6px);
  }
}

/* ===== REVOLUTION NETWORK · POLISH ===== */

.l3nBoard::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:-2px;
  height:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(200,164,92,.55),
      rgba(111,159,104,.45),
      transparent
    );

  opacity:.45;
  pointer-events:none;

  animation:
    l3nScan 4.8s linear infinite;
}


.l3nCore{
  animation:
    l3nCorePulse 2.8s ease-in-out infinite;
}


.l3nCore.online{
  animation:
    l3nCoreOnlinePulse 1.7s ease-in-out infinite;
}


.l3nStageChip{
  position:relative;
}


.l3nStageChip.active::after{
  content:"";

  position:absolute;
  left:0;
  bottom:-2px;

  width:100%;
  height:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #c8a45c,
      transparent
    );

  animation:
    l3nStageGlow 1.8s ease-in-out infinite;
}


.l3nCard.done,
.l3nNode.done,
.l3nEvidence.done{
  box-shadow:
    0 0 0 1px rgba(111,159,104,.07),
    0 0 22px rgba(111,159,104,.08);
}


.l3nMeterFill{
  box-shadow:
    0 0 14px rgba(200,164,92,.24);
}


.l3nFeedback.success{
  animation:
    l3nSuccessFlash .45s ease;
}


.l3nStatusValue{
  text-shadow:
    0 0 12px rgba(200,164,92,.18);
}


@keyframes l3nScan{

  0%{
    transform:translateY(0);
    opacity:0;
  }

  10%{
    opacity:.45;
  }

  90%{
    opacity:.45;
  }

  100%{
    transform:translateY(620px);
    opacity:0;
  }

}


@keyframes l3nCorePulse{

  0%,100%{
    box-shadow:
      0 0 25px rgba(200,164,92,.06);
  }

  50%{
    box-shadow:
      0 0 38px rgba(200,164,92,.16);
  }

}


@keyframes l3nCoreOnlinePulse{

  0%,100%{
    box-shadow:
      0 0 22px rgba(80,140,70,.16),
      0 0 45px rgba(200,164,92,.08);
  }

  50%{
    box-shadow:
      0 0 34px rgba(80,140,70,.3),
      0 0 80px rgba(200,164,92,.13);
  }

}


@keyframes l3nStageGlow{

  0%,100%{
    opacity:.35;
    transform:scaleX(.65);
  }

  50%{
    opacity:1;
    transform:scaleX(1);
  }

}


@keyframes l3nSuccessFlash{

  0%{
    background:
      rgba(70,120,60,.18);
  }

  100%{
    background:
      rgba(200,164,92,.035);
  }

}

/* ===== HOTSPOT ===== */

.finalHotspot{
  position:absolute;

  width:38px;
  height:38px;

  transform:translate(-50%,-50%);

  appearance:none;
  -webkit-appearance:none;

  border:1px solid rgba(235,201,116,.9);
  border-radius:50%;

  background:rgba(200,164,92,.09);

  cursor:pointer;

  box-shadow:
    0 0 0 0 rgba(200,164,92,.4);

  animation:finalHotspotPulse 2s infinite;

  transition:
    transform .2s ease,
    background .2s ease,
    border-color .2s ease;
}

.finalHotspot::before{
  content:"";

  position:absolute;
  left:50%;
  top:50%;

  width:6px;
  height:6px;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:#e7c66d;
}

.finalHotspot:hover{
  transform:
    translate(-50%,-50%)
    scale(1.18);

  background:rgba(200,164,92,.22);
}

.finalHotspot.read{
  border-color:#77a771;
  background:rgba(75,130,70,.16);

  animation:none;
}

.finalHotspot.read::before{
  background:#88c27e;
}

.finalHotspot.finalWrong{
  border-color:#d75a55;
  animation:finalWrongShake .35s;
}

.foodNode{

/* ===== ANIMATION ===== */

@keyframes foodNodePulse{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.35);
  }

}

@keyframes foodGrain1{

  from{
    transform:
      translate(0,0)
      rotate(0deg);
  }

  to{
    transform:
      translate(95px,37px)
      rotate(180deg);
  }

}

@keyframes foodGrain2{

  from{
    transform:
      translate(0,0)
      rotate(0deg);
  }

  to{
    transform:
      translate(-95px,37px)
      rotate(-180deg);
  }

}

@keyframes foodGrain3{

  from{
    transform:
      translate(0,0);
  }

  to{
    transform:
      translate(56px,-42px);
  }

}

@keyframes foodGrain4{

  from{
    transform:
      translate(0,0);
  }

  to{
    transform:
      translate(-56px,-42px);
  }

}

@keyframes foodFailureFlash{

  0%,100%{
    background-color:
      transparent;
  }

  45%{
    background-color:
      rgba(184,59,56,.14);
  }

}

.level4TransitionScan{
  position:absolute;

  left:0;
  right:0;
  top:-10%;

  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(200,164,92,.75),
      transparent
    );

  box-shadow:
    0 0 20px
    rgba(200,164,92,.35);

  animation:
    level4TransitionScan 2.8s
    ease-in-out infinite;
}


/* top text */

.level4TransitionResolved{
  color:#83aa7b;

  font-size:11px;
  letter-spacing:6px;

  opacity:0;

  animation:
    level4TransitionFade .6s
    .2s forwards;
}


/* 01 → 02 timeline */

.level4TransitionPath{
  width:min(520px,80%);

  display:flex;
  align-items:center;

  margin:45px auto 40px;
}

.level4TransitionNode{
  width:55px;
  height:55px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  font-size:12px;
  font-weight:bold;
  letter-spacing:2px;
}

.level4TransitionNode.done{
  border:
    1px solid #78a470;

  color:#8fc187;

  background:
    rgba(83,130,75,.12);

  box-shadow:
    0 0 22px
    rgba(80,140,70,.18);
}

.level4TransitionNode.next{
  border:
    1px solid rgba(200,164,92,.25);

  color:#74634a;

  background:#120b09;

  animation:
    level4NextNode .7s
    2.1s forwards;
}

.level4TransitionTrack{
  position:relative;

  flex:1;
  height:2px;

  margin:0 12px;

  background:#352724;

  overflow:hidden;
}

.level4TransitionTrackFill{
  position:absolute;

  left:0;
  top:0;

  width:0;
  height:100%;

  background:#c8a45c;

  box-shadow:
    0 0 14px
    rgba(200,164,92,.6);

  animation:
    level4PathGrow 1.2s
    .8s forwards;
}


/* dossier */

.level4NextPriority{
  margin-bottom:11px;

  color:#827669;

  font-size:9px;
  letter-spacing:5px;

  opacity:0;

  animation:
    level4TransitionFade .6s
    2.15s forwards;
}

.level4NextCrisisNumber{
  color:#b83b38;

  font-size:12px;
  letter-spacing:6px;

  opacity:0;

  animation:
    level4DossierEnter .65s
    2.35s forwards;
}

.level4NextCrisisTitle{
  margin-top:8px;

  color:#efe3d3;

  font-size:
    clamp(42px,7vw,78px);

  line-height:1;

  opacity:0;

  animation:
    level4DossierEnter .65s
    2.5s forwards;
}

.level4NextCrisisDate{
  margin-top:14px;

  color:#9e8f7e;

  font-size:10px;
  letter-spacing:4px;

  opacity:0;

  animation:
    level4TransitionFade .6s
    2.75s forwards;
}

.level4OpenDossier{
  margin-top:34px;

  opacity:0;
  pointer-events:none;

  animation:
    level4UnlockButton .65s
    3.1s forwards;
}


/* animations */

@keyframes level4PathGrow{

  from{
    width:0;
  }

  to{
    width:100%;
  }

}

@keyframes level4NextNode{

  to{
    border-color:#c8a45c;

    color:#e2c477;

    background:
      rgba(200,164,92,.1);

    box-shadow:
      0 0 28px
      rgba(200,164,92,.32);

    transform:scale(1.08);
  }

}

@keyframes level4TransitionFade{

  from{
    opacity:0;
  }

  to{
    opacity:1;
  }

}

@keyframes level4DossierEnter{

  from{
    opacity:0;
    transform:
      translateY(22px);
  }

  to{
    opacity:1;
    transform:
      translateY(0);
  }

}

@keyframes level4UnlockButton{

  to{
    opacity:1;
    pointer-events:auto;
  }

}

@keyframes level4TransitionScan{

  0%{
    top:5%;
    opacity:0;
  }

  20%{
    opacity:.8;
  }

  80%{
    opacity:.8;
  }

  100%{
    top:95%;
    opacity:0;
  }

}
@keyframes level4WrongDecision{

  0%,100%{
    transform:translateX(0);
  }

  25%{
    transform:translateX(-7px);
  }

  75%{
    transform:translateX(7px);
  }

}

@keyframes level4FeedbackIn{

  from{
    opacity:0;
    transform:translateY(9px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

@keyframes level4StampIn{

  0%{
    opacity:0;
    transform:
      rotate(-2deg)
      scale(1.8);
  }

  70%{
    opacity:1;
    transform:
      rotate(-2deg)
      scale(.93);
  }

  100%{
    opacity:1;
    transform:
      rotate(-2deg)
      scale(1);
  }

}

@keyframes level4DamagePulse{

  0%,100%{
    box-shadow:
      0 0 0
      rgba(184,59,56,0);
  }

  50%{
    box-shadow:
      0 0 35px
      rgba(184,59,56,.28);
  }

}


@media(max-width:800px){

  .level4CrisisStage{
    grid-template-columns:1fr;
  }

  .level4ChoiceGrid{
    grid-template-columns:1fr;
  }

}
@keyframes level4MeterSweep{

  0%{
    left:-55%;
    opacity:0;
  }

  25%{
    opacity:1;
  }

  100%{
    left:130%;
    opacity:0;
  }

}

@keyframes level4DeltaRise{

  0%{
    opacity:0;
    transform:
      translateY(10px);
  }

  25%{
    opacity:1;
    transform:
      translateY(0);
  }

  75%{
    opacity:1;
  }

  100%{
    opacity:0;
    transform:
      translateY(-10px);
  }

}


/* ===== MOBILE ===== */

@media(max-width:900px){

  .level4MeterGrid{
    grid-template-columns:
      repeat(2,1fr);
  }

}

@media(max-width:620px){

  .level4Header{
    flex-direction:column;
    align-items:center;
  }

  .level4HeaderText{
    text-align:center;
  }

  }

  .level4Console{
    grid-template-columns:1fr;
  }

  .level4IndexNote{

  }

}
/* ==================================================
   GLOBAL BACKGROUND IMAGE · FINAL
================================================== */

body{
  position:relative;
  isolation:isolate;
  min-height:100vh;
  overflow-x:hidden;

  background:
    linear-gradient(
      180deg,
      rgba(8,4,4,.58) 0%,
      rgba(10,4,4,.72) 45%,
      rgba(5,3,3,.82) 100%
    ),
    url("global-bg-history.png") center center / cover fixed no-repeat;

  color:#f3eadb;
}


body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;

  background:
    radial-gradient(
      circle at 50% 22%,
      rgba(155,42,36,.22) 0%,
      rgba(120,30,27,.10) 28%,
      transparent 58%
    ),
    linear-gradient(
      90deg,
      rgba(0,0,0,.28) 0%,
      transparent 18%,
      transparent 82%,
      rgba(0,0,0,.28) 100%
    );

  opacity:1;
}


body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;

  background:
    radial-gradient(
      ellipse at center,
      transparent 38%,
      rgba(0,0,0,.10) 68%,
      rgba(0,0,0,.34) 100%
    );

  opacity:1;
}


#game{
  position:relative;
  z-index:1;
  min-height:100vh;
  overflow:hidden;
  background:transparent;
}


.noise{
  position:fixed;
  inset:0;
  z-index:15;
  pointer-events:none;
  opacity:.045;

  background-image:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(255,255,255,.04) 3px
    ),
    repeating-linear-gradient(
      90deg,
      transparent,
      transparent 6px,
      rgba(200,164,92,.02) 7px
    );

  mix-blend-mode:soft-light;
}


.screen{
  position:relative;
  z-index:2;
}


.content{
  position:relative;
}


.content::before{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(920px,92vw);
  height:min(680px,82vh);
  z-index:-1;
  pointer-events:none;

  background:
    radial-gradient(
      ellipse at center,
      rgba(90,28,24,.08) 0%,
      rgba(60,18,18,.04) 40%,
      transparent 72%
    );

  filter:blur(10px);
}


@media(max-width:700px){
  body{
    background:
      linear-gradient(
        180deg,
        rgba(8,4,4,.66) 0%,
        rgba(6,3,3,.84) 100%
      ),
      url("global-bg-history.png") center center / cover no-repeat;
  }

  .noise{
    opacity:.035;
  }
}

/* ===== CINEMATIC JOURNEY · WOW POLISH ===== */

/* điểm sáng chạy ở đầu timeline */
.timelineFill{
  overflow:visible;
}

.timelineFill::after{
  content:"";

  position:absolute;
  right:-6px;
  top:50%;

  width:12px;
  height:12px;

  transform:translateY(-50%);

  border-radius:50%;

  background:#efd17c;

  box-shadow:
    0 0 8px rgba(239,209,124,.95),
    0 0 22px rgba(200,164,92,.65);

  animation:
    routeHeadPulse .8s ease-in-out infinite;
}


/* con tàu sáng nhẹ */
.ship{
  z-index:4;

  color:#e3c269;

  filter:
    drop-shadow(
      0 0 8px
      rgba(200,164,92,.38)
    );
}


/* giữ SVG tàu sắc nét */
.ship svg{
  display:block;

  width:48px;
  height:48px;
}


/* vệt sáng phía sau tàu */
.ship::before{
  content:"";

  position:absolute;

  left:-58px;
  top:50%;

  width:60px;
  height:2px;

  transform:
    translateY(-50%);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(200,164,92,.08),
      rgba(226,193,105,.75)
    );

  opacity:.7;

  pointer-events:none;
}


/* text đổi mốc mềm hơn */
.cineText.logSwap{
  animation:
    cineLogSwap .42s ease both;
}


/* khi tàu tới 1920 */
.timelineScene.arrived
.p1920{
  animation:
    checkpointBurst 1s ease-out forwards;
}


/* đầu timeline dừng rung khi đã đến nơi */
.timelineScene.arrived
.timelineFill::after{
  animation:none;

  transform:
    translateY(-50%)
    scale(1.25);

  box-shadow:
    0 0 10px rgba(239,209,124,1),
    0 0 34px rgba(200,164,92,.85);
}


/* toàn panel lóe nhẹ lúc unlock */
.cinematic.arrived{
  animation:
    cineArrivalGlow 1.15s ease;
}


@keyframes routeHeadPulse{

  0%,100%{
    transform:
      translateY(-50%)
      scale(.82);

    opacity:.7;
  }

  50%{
    transform:
      translateY(-50%)
      scale(1.18);

    opacity:1;
  }

}


@keyframes cineLogSwap{

  from{
    opacity:.15;

    transform:
      translateY(8px);

    filter:
      blur(3px);
  }

  to{
    opacity:1;

    transform:
      translateY(0);

    filter:
      blur(0);
  }

}


@keyframes checkpointBurst{

  0%{
    background:#c8a45c;

    border-color:#f1d28e;

    transform:
      translateX(-50%)
      scale(1);

    box-shadow:
      0 0 20px
      rgba(200,164,92,.7);
  }

  45%{
    transform:
      translateX(-50%)
      scale(1.42);

    box-shadow:
      0 0 0 16px
      rgba(200,164,92,.07),

      0 0 38px
      rgba(239,209,124,.9);
  }

  100%{
    background:#c8a45c;

    border-color:#f1d28e;

    transform:
      translateX(-50%)
      scale(1);

    box-shadow:
      0 0 28px
      rgba(200,164,92,.82);
  }

}


@keyframes cineArrivalGlow{

  0%,100%{
    box-shadow:
      0 28px 90px
      rgba(0,0,0,.22);
  }

  45%{
    box-shadow:
      0 28px 90px
      rgba(0,0,0,.22),

      inset 0 0 70px
      rgba(200,164,92,.07),

      0 0 55px
      rgba(200,164,92,.08);
  }

}

function setupLevel2(){

  const cards = document.querySelectorAll(".conceptCard");
  const slots = document.querySelectorAll(".dropSlot");

  cards.forEach(function(card){

    card.addEventListener("click",function(){

      cards.forEach(c => c.classList.remove("selected"));

      card.classList.add("selected");

      level2Selected = card;

      document.getElementById("level2Feedback").textContent =
        "Đã chọn mảnh ghép. Hãy chọn vị trí phù hợp.";

    });


    card.addEventListener("dragstart",function(e){

      e.dataTransfer.setData(
        "text/plain",
        card.dataset.match
      );

      level2Selected = card;

    });

  });


  slots.forEach(function(slot){

    slot.addEventListener("click",function(){

      if(!level2Selected){

        document.getElementById("level2Feedback").textContent =
          "Hãy chọn một mảnh ghép trước.";

        return;
      }

      checkLevel2Match(level2Selected,slot);

    });


    slot.addEventListener("dragover",function(e){
      e.preventDefault();
    });


    slot.addEventListener("drop",function(e){

      e.preventDefault();

      const match = e.dataTransfer.getData("text/plain");

      const card = [...document.querySelectorAll(".conceptCard")]
        .find(c => c.dataset.match === match);

      if(card){
        checkLevel2Match(card,slot);
      }

    });

  });
}


function checkLevel2Match(card,slot){

  if(!level2Active) return;

  if(card.dataset.match === slot.dataset.match){

    card.classList.remove("selected");

    card.classList.add("matched");

    slot.classList.add("matched");

    slot.innerHTML =
      "✓ " + slot.innerHTML;

    xp += 150;
    level2Matched++;

    updateHUD();

    document.getElementById("level2Feedback").innerHTML =
      `<span style="color:#8fb987">
      ✓ GHÉP CHÍNH XÁC &nbsp; +150 XP
      </span>`;

    level2Selected = null;

    if(level2Matched === 3){

      level2Active = false;

      clearInterval(level2Interval);

      setTimeout(level2Complete,800);

    }

  } else {

    hearts--;

    updateHUD();

    slot.classList.remove("wrong");

    void slot.offsetWidth;

    slot.classList.add("wrong");

    document.getElementById("level2Feedback").innerHTML =
      `<span style="color:#d45d58">
      ✕ Chưa đúng mối liên hệ. Hãy thử lại.
      </span>`;

    card.classList.remove("selected");

    level2Selected = null;

    if(hearts <= 0){

      clearInterval(level2Interval);

      level2Fail("BẠN ĐÃ HẾT 3 LƯỢT");

    }

  }
}

    phase2Pieces.length;


  const stage3 =
    l3nVerifiedEvidence.size /
    phase3Cases.length;


  return Math.round(
    (
      stage1 +
      stage2 +
      stage3
    )
    / 3
    * 100
  );
}


function l3nRailClass(stage){

  if(stage < l3nStage){
    return "done";
  }

  if(stage === l3nStage){
    return "active";
  }

  return "";
}

function handleL3NClick(event){

  const target =
    event.target.closest(
      "[data-l3n-action]"
    );


  if(!target){
    return;
  }


  const action =
    target.dataset.l3nAction;


  /* ===== SELECT ORGANIZATION ===== */

  if(action === "select-org"){

    const id =
      target.dataset.l3nId;


    if(
      l3nRoutedOrgs.has(id)
    ){
      return;
    }


    l3nSelectedOrg = id;

    renderLevel3Network();

    return;
  }


  /* ===== ROUTE ORGANIZATION ===== */

  if(action === "route-org"){

    if(!l3nSelectedOrg){

      showL3NFeedback(
        "Hãy chọn một tổ chức trước.",
        true
      );

      return;
    }


    const org =
      l3nOrganizations.find(
        function(item){

          return (
            item.id ===
            l3nSelectedOrg
          );

        }
      );


    const route =
      target.dataset.l3nRoute;


    if(
      !org ||
      org.route !== route
    ){

      target.classList.add(
        "l3nWrong"
      );


      showL3NFeedback(
        "ROUTING ERROR · Tuyến vừa chọn chưa đúng. Hãy thử lại.",
        true
      );

      return;
    }


    l3nRoutedOrgs.add(
      org.id
    );


    l3nSelectedOrg = null;


    xp += 300;

    l3nLevelXP += 300;


    updateHUD();

renderLevel3Network();


if(
  l3nRoutedOrgs.size <
  l3nOrganizations.length
){

  const feedback =
    document.getElementById(
      "l3nFeedback"
    );


  if(feedback){

    feedback.innerHTML = `

      <strong class="gold">
        ROUTE VERIFIED
      </strong>

      <br>

      ${org.name}

      <br>

      ${
        org.route === "conference"
        ?
        "ĐÃ KẾT NỐI · THAM DỰ HỘI NGHỊ HỢP NHẤT"
        :
        "ĐÃ KẾT NỐI · GIA NHẬP SAU"
      }

      <br><br>

      ROUTE VERIFIED · +300 XP

    `;


    feedback.classList.add(
      "success"
    );

  }

}


return;
  }


/* ===== NEXT STAGE ===== */

if(action === "next-stage"){

  if(
    l3nStage === 1 &&
    l3nRoutedOrgs.size ===
    l3nOrganizations.length
  ){

    showL3NStageTransition(2);

    return;
  }


  if(
    l3nStage === 2 &&
    l3nSolvedSignals.size ===
    phase2Pieces.length
  ){

    showL3NStageTransition(3);

    return;
  }

}

  /* ===== SELECT SIGNAL ===== */

  if(action === "select-signal"){

    const id =
      target.dataset.l3nId;


    if(
      l3nSolvedSignals.has(id)
    ){
      return;
    }


    l3nSelectedSignal = id;

    renderLevel3Network();

    return;
  }


  /* ===== CONNECT SIGNAL ===== */

  if(action === "connect-signal"){

    if(!l3nSelectedSignal){

      showL3NFeedback(
        "Hãy chọn một SIGNAL trước.",
        true
      );

      return;
    }


    const piece =
      phase2Pieces.find(
        function(item){

          return (
            item.id ===
            l3nSelectedSignal
          );

        }
      );


    const node =
      target.dataset.l3nTarget;


    if(
      !piece ||
      piece.target !== node
    ){

      target.classList.add(
        "l3nWrong"
      );


      showL3NFeedback(
        "ROUTING ERROR · Tín hiệu chưa thuộc node này. Hãy thử lại.",
        true
      );

      return;
    }


    l3nSolvedSignals.add(
      piece.id
    );


    const reward =
      piece.target === "noise"
      ?
      75
      :
      150;


    xp += reward;

    l3nLevelXP += reward;


    l3nSelectedSignal = null;


   updateHUD();

renderLevel3Network();


if(
  l3nSolvedSignals.size <
  phase2Pieces.length
){

  const feedback =
    document.getElementById(
      "l3nFeedback"
    );


  if(feedback){

    feedback.innerHTML = `

      <strong class="gold">

        ${piece.icon}
        SIGNAL VERIFIED

      </strong>

      <br>

      ${piece.knowledge}

      <br><br>

      +${reward} XP

    `;


    feedback.classList.add(
      "success"
    );

  }

}


return;
  }


 /* ===== SELECT EVIDENCE SIGNAL ===== */

  if(action === "select-evidence-signal"){

    const id =
      target.dataset.l3nId;


    if(
      l3nLinkedEvidenceSignals.has(id)
    ){
      return;
    }


    l3nSelectedEvidenceSignal =
      l3nSelectedEvidenceSignal === id
      ? null
      : id;


    renderLevel3Network();

    return;
  }


  /* ===== CONNECT EVIDENCE NODE ===== */

  if(action === "connect-evidence-node"){

    if(!l3nSelectedEvidenceSignal){

      showL3NFeedback(
        "SYNC WAITING · Hãy chọn một SIGNAL FRAGMENT trước.",
        true
      );

      return;
    }


    const signal =
      phase3Signals.find(
        function(item){
          return (
            item.id ===
            l3nSelectedEvidenceSignal
          );
        }
      );


    const nodeId =
      target.dataset.l3nId;


    const node =
      phase3Cases.find(
        function(item){
          return (
            item.id === nodeId
          );
        }
      );


    if(!signal || !node){
      return;
    }


    if(signal.node !== node.id){

      target.classList.remove(
        "l3nWrong"
      );

      void target.offsetWidth;

      target.classList.add(
        "l3nWrong"
      );


      showL3NFeedback(
        "SYNC ERROR · Mảnh tín hiệu này không hỗ trợ node vừa chọn. Tín hiệu vẫn được giữ để bạn thử lại.",
        true
      );

      return;
    }


    const links =
      l3nEvidenceNodeSignals[node.id] ||
      [];


    if(!links.includes(signal.id)){

      links.push(signal.id);

      l3nEvidenceNodeSignals[node.id] =
        links;

      l3nLinkedEvidenceSignals.add(
        signal.id
      );

    }


    l3nSelectedEvidenceSignal = null;


    const nodeJustCompleted =
      links.length >= node.required &&
      !l3nVerifiedEvidence.has(
        node.id
      );


    if(nodeJustCompleted){

      l3nVerifiedEvidence.add(
        node.id
      );

      xp += 125;
      l3nLevelXP += 125;

      updateHUD();

    }


    renderLevel3Network();


    if(
      l3nVerifiedEvidence.size <
      phase3Cases.length
    ){

      const feedback =
        document.getElementById(
          "l3nFeedback"
        );


      if(feedback){

        if(nodeJustCompleted){

          feedback.innerHTML = `

            <strong class="gold">
              ${node.evidence} · NODE SYNCHRONIZED
            </strong>

            <br>

            ${node.note}

            <br><br>

            +125 XP ·
            ${l3nVerifiedEvidence.size}/4 NODES ONLINE

          `;

        }
        else{

          feedback.innerHTML = `

            <strong class="gold">

function getLevel4MetricAverage(){

  const values =
    Object.values(
      level4Metrics
    );

  const total =
    values.reduce(
      function(sum,value){

        return sum + value;

      },
      0
    );

  return Math.round(
    total / values.length
  );

}


function level4NeedsRecovery(){

  const values =
    Object.values(
      level4Metrics
    );


  const criticalMetric =
    values.some(
      function(value){

        return value < 25;

      }
    );


  const average =
    getLevel4MetricAverage();


  return (
    criticalMetric ||
    average < 35

}

/* ===== ANIMATE NUMBER ===== */

function animateLevel4Number(
  element,
  from,
  to,
  duration = 850
){

  const start =
    performance.now();


  function frame(now){

    const progress =
      Math.min(
        (now - start) / duration,
        1
      );


    const eased =
      1 -
      Math.pow(
        1 - progress,
        3
      );


    element.textContent =
      Math.round(
        from +
        (to - from) * eased
      );


    if(progress < 1){

      requestAnimationFrame(
        frame
      );

    }

  }


  requestAnimationFrame(
    frame
  );

}


/* ===== UPDATE VISUAL ===== */

function setLevel4MetricVisual(
  key,
  newValue,
  delta
){

  const value =
    document.getElementById(
      "level4Value-" + key
    );


  const fill =
    document.getElementById(
      "level4Fill-" + key
    );


  const card =
    document.getElementById(
      "level4Card-" + key
    );


  const deltaBox =
    document.getElementById(
      "level4Delta-" + key
    );


  if(
    !value ||
    !fill ||
    !card
  ){
    return;
  }


  const current =
    Number(
      value.textContent
    ) || 0;


  const safeValue =
    Math.max(
      0,
      Math.min(
        100,
        newValue
      )
    );


  fill.style.width =
    safeValue + "%";


  animateLevel4Number(
    value,
    current,
    safeValue
  );


  card.classList.remove(
    "boost"
  );


  void card.offsetWidth;


  card.classList.add(
    "boost"
  );


  setTimeout(
    function(){

      card.classList.remove(
        "boost"
      );

    },
    950
  );


  if(
    delta !== null &&
    delta !== 0 &&
    deltaBox
  ){

    deltaBox.textContent =
      delta > 0
      ? "+" + delta
      : delta;


    deltaBox.classList.remove(
      "show"
    );


    void deltaBox.offsetWidth;


    deltaBox.classList.add(
      "show"
    );

  }

}

/* ===== HANDLE DECISION ===== */

function handleLevel4Decision(
  crisisIndex,
  choiceIndex
){

  if(level4DecisionLocked) return;


  level4DecisionLocked =
    true;


  const crisis =
    level4Crises[
      crisisIndex
    ];


  const choice =
    crisis.choices[
      choiceIndex
    ];


  const firstResolution =
    !level4ResolvedCrises.has(
      crisis.id
    );


  const buttons =
    [
      ...document
        .querySelectorAll(
          ".level4DecisionChoice"
        )
    ];


  buttons.forEach(
    function(button){

      button.disabled =
        true;

    }
  );


  const selectedButton =
    buttons[
      choiceIndex
    ];


  const correctIndex =
    crisis.choices
      .findIndex(
        function(item){

          return item.correct;

        }
      );


  if(choice.correct){

    selectedButton
      .classList.add(
        "correctDecision"
      );

  }

  else{

    selectedButton
      .classList.add(
        "wrongDecision"
      );


    if(
      buttons[
        correctIndex

      buttons[
        correctIndex

      .classList.add(

  const foodVisual =

  const literacyVisual =

if(

/* ===== APPLY EFFECTS ===== */

function applyLevel4DecisionEffects(
  effects
){

  Object
    .keys(effects)
    .forEach(
      function(key,index){

        setTimeout(
          function(){

            const delta =
              effects[key];


            level4Metrics[key] =
              Math.max(
                0,
                Math.min(
                  100,
                  level4Metrics[key]
                  + delta
                )
              );


            setLevel4MetricVisual(

              key,

              level4Metrics[key],

              delta

            );


            if(delta < 0){

              const card =
                document
                  .getElementById(
                    "level4Card-" + key
                  );


              if(card){

                card.classList.remove(
                  "boost"
                );

                void card.offsetWidth;

                card.classList.add(
                  "damage"
                );


                setTimeout(
                  function(){

                    card.classList.remove(
                      "damage"
                    );

                  },
                  600
                );

              }

            }

          },

          index * 180

        );

      }
    );

}


/* ===== EFFECT CHIPS ===== */

function getLevel4MetricName(
  key
){

  const item =
    level4MetricData
      .find(
        function(metric){

          return metric.key === key;

        }
      );


  return item
    ? item.name
    : key;

}

      .keys(choice.effects)

            <div
              class="

                ${
                  delta > 0
                  ? "positive"
                  : "negative"
                }
              ">

              ${getLevel4MetricName(key)}

              ${delta > 0 ? "+" : ""}

              ${delta}

            </div>

          `;

    `;


  document
    .getElementById(
      "returnFinalHub4"
    )
    .addEventListener(
      "click",
      renderFinalJourneyHub
    );
}

/* ===== FINAL ENDING ===== */

function showFinalJourneyEnding(){

  hud.style.display = "none";

  window.scrollTo(
    0,
    0
  );


  /* =========================
     FINAL RANK SYSTEM
  ========================= */

  const FINAL_MAX_XP = 6050;

  const finalScore =
    Math.max(
      0,
      Math.min(
        xp,
        FINAL_MAX_XP
      )
    );

  const finalPercent =
    (
      finalScore /
      FINAL_MAX_XP
    ) * 100;


  let finalRank;

  if(finalScore < 3000){

    finalRank = {

      level:1,

      eyebrow:
        "TIER 01 · JOURNEY COMPLETE",

      title:
        "NGƯỜI MỞ ĐƯỜNG",

      description:
        "Bạn đã hoàn thành hành trình và nắm được những cột mốc chính xuyên suốt trò chơi."

    };

  }

  else if(finalScore < 5000){

    finalRank = {

      level:2,

      eyebrow:
        "TIER 02 · JOURNEY COMPLETE",

      title:
        "NGƯỜI KẾT NỐI TƯ TƯỞNG",

      description:
        "Bạn đã kết nối được các giai đoạn, mục tiêu, lực lượng và những lựa chọn cốt lõi của hành trình."

    };

  }

  else{

    finalRank = {

      level:3,

      eyebrow:
        "TIER 03 · JOURNEY COMPLETE",

      title:
        "NGƯỜI DẪN ĐƯỜNG",

      description:
        "Bạn đã làm chủ gần như toàn bộ hành trình và đưa ra phần lớn những lựa chọn chính xác."

    };

  }


  const isPerfect =
    finalScore >=
    FINAL_MAX_XP;


  /* =========================
     RENDER ENDING
  ========================= */

  screen.innerHTML = `

    <div
      class="
        content
        finalEndingScene
      "
    >

      <div class="finalEndingResult">


        <div class="endingResultTop">

          <div class="endingResultLabel">
            FINAL JOURNEY · RESULT
          </div>

          <div class="endingPerfectBadge">

            ${
              isPerfect
              ? "★ MAXIMUM SCORE"
              : "JOURNEY COMPLETE"
            }

          </div>

        </div>


        <div class="endingRankBlock">

          <div class="endingRankEyebrow">

            ${finalRank.eyebrow}

          </div>


          <div class="endingRankTitle">

            ${finalRank.title}

          </div>


          <p class="endingRankDescription">

            ${finalRank.description}

          </p>

        </div>


        <div class="endingScoreRow">

          <div
            class="endingScoreValue"
            id="endingXpValue"
          >
            0
          </div>

          <div class="endingScoreMax">
            / ${FINAL_MAX_XP} XP
          </div>

        </div>


        <div class="endingXpArea">

          <div class="endingXpTrack">

            <div
              class="endingXpFill"
              id="endingXpFill"
            >
            </div>


            <div
              class="
                endingXpTick
                t3000
              "
            >
            </div>


            <div
              class="
                endingXpTick
                t5000
              "
            >
            </div>


            <div
              class="
                endingXpTick
                t6050
              "
            >
            </div>


            <div
              class="endingXpMarker"
              id="endingXpMarker"
            >
            </div>

          </div>


          <div class="endingXpScale">

            <span class="s0">
              0
            </span>

            <span class="s3000">
              3000
            </span>

            <span class="s5000">
              5000
            </span>

            <span class="s6050">
              6050
            </span>

          </div>

        </div>


        <div class="endingTiers">


          <div
            class="
              endingTier
              ${
                finalRank.level === 1
                ? "active"
                : ""
              }
            "
          >

            <div class="endingTierRange">
              0 — 2999 XP
            </div>

            <div class="endingTierName">
              NGƯỜI MỞ ĐƯỜNG
            </div>

          </div>


          <div
            class="
              endingTier
              ${
                finalRank.level === 2
                ? "active"
                : ""
              }
            "
          >

            <div class="endingTierRange">
              3000 — 4999 XP
            </div>

            <div class="endingTierName">
              NGƯỜI KẾT NỐI TƯ TƯỞNG
            </div>

          </div>


          <div
            class="
              endingTier
              ${
                finalRank.level === 3
                ? "active"
                : ""
              }
            "
          >

            <div class="endingTierRange">
              5000 — 6050 XP
            </div>

            <div class="endingTierName">
              NGƯỜI DẪN ĐƯỜNG
            </div>

          </div>


        </div>


        ${
          isPerfect
          ? `

            <div class="endingPerfectMessage">

              ★ PERFECT RUN · MAX XP ·
              TOÀN BỘ HÀNH TRÌNH ĐÃ ĐƯỢC CHINH PHỤC ★

            </div>

          `
          : ""
        }


        <div class="endingActions">

          <button
            class="btn"
            id="endingReviewBtn"
          >
            XEM LẠI 4 GIAI ĐOẠN
          </button>


          <button
            class="
              btn
              endingReplayBtn
            "
            id="endingReplayBtn"
          >
            CHƠI LẠI TỪ ĐẦU
          </button>

        </div>


      </div>

    </div>

  `;


  /* =========================
     XP BAR ANIMATION
  ========================= */

  const xpFill =
    document.getElementById(
      "endingXpFill"
    );

  const xpMarker =
    document.getElementById(
      "endingXpMarker"
    );


  requestAnimationFrame(
    function(){

      requestAnimationFrame(
        function(){

          xpFill.style.width =
            finalPercent + "%";

          xpMarker.style.left =
            finalPercent + "%";

        }
      );

    }
  );


  /* =========================
     XP COUNT-UP
  ========================= */

  const xpValue =
    document.getElementById(
      "endingXpValue"
    );


  const countDuration =
    1500;

  const countStart =
    performance.now();


  function animateEndingScore(
    now
  ){

    const progress =
      Math.min(
        1,
        (
          now -
          countStart
        ) /
        countDuration
      );


    const eased =
      1 -
      Math.pow(
        1 - progress,
        3
      );


    xpValue.textContent =
      Math.round(
        finalScore *
        eased
      );


    if(progress < 1){

      requestAnimationFrame(
        animateEndingScore
      );

    }

  }


  requestAnimationFrame(
    animateEndingScore
  );


  /* =========================
     BUTTONS
  ========================= */

  document
    .getElementById(
      "endingReviewBtn"
    )
    .addEventListener(
      "click",
      function(){

        window.scrollTo(
          0,
          0
        );

        renderFinalJourneyHub();

      }
    );


  document
    .getElementById(
      "endingReplayBtn"
    )
    .addEventListener(
      "click",
      function(){

        window.location.reload();

      }
    );

}
</script>

</body>
</html>
