<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hành Trình Tư Tưởng</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:radial-gradient(circle at center,#351414 0%,#150909 55%,#070404 100%);
  color:#f3eadb;
  min-height:100vh;
}

#game{
  min-height:100vh;
  position:relative;
  overflow:hidden;
}

.noise{
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.07;
  background-image:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(255,255,255,.05) 3px
  );
}

.screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:90px 24px 60px;
  animation:appear .8s ease;
}

.content{
  width:min(950px,100%);
}

.small{
  letter-spacing:6px;
  font-size:13px;
  color:#c8a45c;
  margin-bottom:22px;
}

h1{
  font-size:clamp(45px,8vw,90px);
  line-height:.95;
  margin-bottom:25px;
}

.red{color:#b83b38}
.gold{color:#c8a45c}

.subtitle{
  max-width:700px;
  margin:0 auto 35px;
  color:#c8beb1;
  font-size:18px;
  line-height:1.7;
}

.btn{
  border:1px solid #c8a45c;
  background:transparent;
  color:#f5ead5;
  padding:16px 30px;
  font-size:14px;
  letter-spacing:2px;
  cursor:pointer;
  transition:.25s;
}

.btn:hover{
  background:#c8a45c;
  color:#160909;
  transform:translateY(-3px);
}

/* HUD */
#hud{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  padding:18px 28px;
  display:none;
  justify-content:space-between;
  align-items:center;
  z-index:20;
  background:rgba(8,4,4,.8);
  border-bottom:1px solid rgba(200,164,92,.25);
  backdrop-filter:blur(8px);
}

.hudBlock{
  font-size:13px;
  letter-spacing:2px;
}

#hearts{color:#d95550;font-size:20px}

.progressWrap{
  width:180px;
  height:5px;
  background:#332727;
  margin-top:8px;
}

#progress{
  width:20%;
  height:100%;
  background:#c8a45c;
}

/* LEVEL 1 */
.levelTitle{
  font-size:clamp(32px,6vw,65px);
  margin-bottom:10px;
}

.mission{
  color:#c8a45c;
  letter-spacing:3px;
  font-size:13px;
  margin-bottom:12px;
}

.objects{
  margin:38px auto 25px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  max-width:760px;
}

.object{
  min-height:145px;
  border:1px solid rgba(200,164,92,.25);
  background:rgba(255,255,255,.035);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.25s;
  padding:18px;
}

.object:hover{
  transform:translateY(-6px);
  border-color:#c8a45c;
  background:rgba(200,164,92,.08);
}

.object .icon{
  font-size:48px;
  margin-bottom:12px;
}

.object .label{
  font-size:12px;
  letter-spacing:2px;
  color:#a99f91;
}

.object.correct-found{
  border-color:#7aaa72;
  background:rgba(70,120,60,.12);
  opacity:.55;
  pointer-events:none;
}

.object.wrong{
  animation:shake .35s;
  border-color:#b83b38;
}

#message{
  min-height:35px;
  margin-top:20px;
  font-size:15px;
  letter-spacing:1px;
  color:#d8c9b4;
}

.completeBox{
  padding:45px 25px;
  border:1px solid rgba(200,164,92,.4);
  background:rgba(255,255,255,.025);
  max-width:700px;
  margin:auto;
}

.scoreBig{
  font-size:70px;
  color:#c8a45c;
  margin:15px 0;
  font-weight:bold;
}

@keyframes appear{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-8px)}
  75%{transform:translateX(8px)}
}
/* ===== CINEMATIC 1911 → 1920 ===== */

.cinematic{
  position:relative;
  width:min(1000px,100%);
  min-height:520px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  overflow:hidden;
}

.cineTitle{
  font-size:13px;
  letter-spacing:7px;
  color:#c8a45c;
  margin-bottom:45px;
}

.timelineScene{
  position:relative;
  width:85%;
  max-width:850px;
  height:180px;
  margin:auto;
}

.timelineBase{
  position:absolute;
  left:0;
  right:0;
  top:90px;
  height:2px;
  background:#352929;
}

.timelineFill{
  position:absolute;
  left:0;
  top:90px;
  height:2px;
  width:0;
  background:#c8a45c;
  animation:growTimeline 5.5s ease forwards;
}

.yearPoint{
  position:absolute;
  top:82px;
  width:18px;
  height:18px;
  border-radius:50%;
  border:2px solid #62513a;
  background:#150909;
  transform:translateX(-50%);
}

.yearPoint::after{
  content:attr(data-year);
  position:absolute;
  top:32px;
  left:50%;
  transform:translateX(-50%);
  font-size:14px;
  letter-spacing:3px;
  color:#837569;
}

.p1911{
  left:5%;
  animation:unlockPoint .5s .4s forwards;
}

.p1919{
  left:55%;
  animation:unlockPoint .5s 3s forwards;
}

.p1920{
  left:95%;
  animation:unlockPoint .5s 5.2s forwards;
}

.ship{
  position:absolute;
  top:25px;
  left:1%;
  font-size:48px;
  animation:shipJourney 5.5s ease-in-out forwards;
}

.cineText{
  min-height:80px;
  margin-top:25px;
  font-size:18px;
  line-height:1.7;
  color:#c8beb1;
  transition:.4s;
}

#cineContinue{
  opacity:0;
  pointer-events:none;
  margin-top:20px;
  animation:showContinue .8s 6.2s forwards;
}

@keyframes growTimeline{
  from{width:0}
  to{width:100%}
}

@keyframes shipJourney{
  0%{
    left:1%;
    transform:translateY(0) rotate(-2deg);
  }

  35%{
    transform:translateY(-8px) rotate(2deg);
  }

  65%{
    transform:translateY(5px) rotate(-1deg);
  }

  100%{
    left:90%;
    transform:translateY(0);
  }
}

@keyframes unlockPoint{
  to{
    background:#c8a45c;
    border-color:#f1d28e;
    box-shadow:0 0 20px rgba(200,164,92,.8);
  }
}

@keyframes showContinue{
  to{
    opacity:1;
    pointer-events:auto;
  }
}

@media(max-width:650px){
  .objects{grid-template-columns:repeat(2,1fr)}
  #hud{padding:14px 12px}
  .progressWrap{width:90px}
  .hudBlock{font-size:10px}
}
  /* ===== LEVEL 2 PREMIUM UI ===== */

.level2Top{
  width:min(900px,100%);
  margin:0 auto 15px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:30px;
}

.timerBox{
  flex-shrink:0;
  padding:12px 20px;
  border:1px solid rgba(200,164,92,.45);
  background:rgba(200,164,92,.07);
  color:#d9b96e;
  border-radius:8px;
  font-size:16px;
  letter-spacing:2px;
}

.matchBoard{
  width:min(900px,100%);
  margin:30px auto 0;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:28px;
}

.cardColumn,
.slotColumn{
  display:flex;
  flex-direction:column;
  gap:14px;

  padding:22px;
  border:1px solid rgba(200,164,92,.16);
  background:rgba(255,255,255,.025);
  border-radius:12px;
}

.columnTitle{
  margin-bottom:8px;
  color:#c8a45c;
  font-size:12px;
  letter-spacing:4px;
  text-align:left;
}

/* XÓA HOÀN TOÀN GIAO DIỆN BUTTON MẶC ĐỊNH */

button.conceptCard,
button.dropSlot{
  appearance:none;
  -webkit-appearance:none;

  display:flex;
  align-items:center;

  width:100%;
  min-height:82px;

  padding:16px 18px;

  border-radius:9px;
  border:1px solid rgba(200,164,92,.22);

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.018)
    );

  color:#eadfce;

  font-family:Arial,sans-serif;
  font-size:15px;
  line-height:1.45;
  text-align:left;

  cursor:pointer;

  transition:
    transform .22s ease,
    border-color .22s ease,
    background .22s ease,
    box-shadow .22s ease;
}

button.conceptCard:hover,
button.dropSlot:hover{
  transform:translateY(-3px);
  border-color:#c8a45c;
  background:rgba(200,164,92,.08);
}

button.conceptCard.selected{
  border-color:#d4ad58;

  background:
    linear-gradient(
      135deg,
      rgba(200,164,92,.18),
      rgba(200,164,92,.06)
    );

  box-shadow:
    0 0 0 1px rgba(200,164,92,.15),
    0 8px 30px rgba(0,0,0,.25);

  transform:translateX(7px);
}

button.dropSlot{
  border-style:dashed;
  color:#bdb1a1;
  background:rgba(0,0,0,.13);
}

button.conceptCard.matched,
button.dropSlot.matched{
  border-style:solid;
  border-color:#6f9f68;

  background:
    linear-gradient(
      135deg,
      rgba(74,120,67,.22),
      rgba(74,120,67,.08)
    );

  color:#a9d3a4;

  pointer-events:none;
}

.level2Feedback{
  width:min(900px,100%);
  min-height:48px;

  margin:22px auto 0;
  padding:13px 18px;

  border-top:1px solid rgba(200,164,92,.15);

  color:#c8beb1;

  font-size:15px;
  letter-spacing:.5px;
}

.timerDanger{
  color:#e06460 !important;
  border-color:#b83b38 !important;

  box-shadow:
    0 0 20px rgba(184,59,56,.25);

  animation:timerPulse .7s infinite alternate;
}

@keyframes timerPulse{
  from{
    transform:scale(1);
  }

  to{
    transform:scale(1.06);
  }
}

@media(max-width:750px){

  .matchBoard{
    grid-template-columns:1fr;
  }

  .level2Top{
    align-items:center;
    flex-direction:column;
  }

  button.conceptCard,
  button.dropSlot{
    min-height:70px;
  }
}
  /* ===== CINEMATIC 1930 ===== */

.c1930{
  position:relative;
  width:min(1000px,100%);
  min-height:620px;
  overflow:hidden;
}

.c1930Tag{
  color:#c8a45c;
  letter-spacing:7px;
  font-size:12px;
  margin-bottom:20px;
}

.c1930Title{
  font-size:clamp(42px,7vw,82px);
  line-height:1;
  margin-bottom:18px;
}

.c1930Sub{
  color:#a99f91;
  font-size:15px;
  letter-spacing:2px;
  margin-bottom:35px;
}

.fractureScene{
  position:relative;
  width:min(900px,100%);
  height:250px;
  margin:0 auto;
}

.orgStream{
  position:absolute;
  width:230px;
  min-height:58px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:12px 16px;

  border:1px solid rgba(184,59,56,.45);
  background:rgba(184,59,56,.08);

  color:#e7d9c8;

  font-size:12px;
  line-height:1.4;
  letter-spacing:1px;

  box-shadow:
    0 0 20px rgba(184,59,56,.08);

  opacity:0;
}

.org1{
  left:0;
  top:15px;
  animation:orgEnterLeft .7s .5s forwards;
}

.org2{
  right:0;
  top:90px;
  animation:orgEnterRight .7s 1.1s forwards;
}

.org3{
  left:40px;
  bottom:10px;
  animation:orgEnterLeft .7s 1.7s forwards;
}

.unityCore{
  position:absolute;

  left:50%;
  top:50%;

  width:105px;
  height:105px;

  transform:translate(-50%,-50%) scale(.3);

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  border:1px solid rgba(200,164,92,.8);

  background:
    radial-gradient(
      circle,
      rgba(200,164,92,.28),
      rgba(200,164,92,.03)
    );

  color:#e9c978;

  font-size:13px;
  letter-spacing:3px;

  opacity:0;

  animation:coreAwake .8s 3.2s forwards;
}

.unityLine{
  position:absolute;

  left:50%;
  top:50%;

  width:0;
  height:2px;

  transform-origin:left center;

  background:linear-gradient(
    90deg,
    rgba(184,59,56,.8),
    #c8a45c
  );

  box-shadow:0 0 14px rgba(200,164,92,.55);

  opacity:0;
}

.line1{
  transform:rotate(-155deg);
  animation:lineGrow .8s 3.8s forwards;
}

.line2{
  transform:rotate(-15deg);
  animation:lineGrow .8s 4.1s forwards;
}

.line3{
  transform:rotate(155deg);
  animation:lineGrow .8s 4.4s forwards;
}

.c1930Text{
  min-height:70px;

  width:min(760px,100%);
  margin:18px auto 0;

  color:#c8beb1;

  font-size:18px;
  line-height:1.65;

  transition:.35s;
}

.c1930Stamp{
  margin:25px auto 0;

  width:max-content;

  padding:13px 25px;

  border:3px solid #b83b38;

  color:#d6605c;

  font-weight:bold;
  letter-spacing:5px;

  transform:rotate(-5deg) scale(2.2);

  opacity:0;

  animation:stamp1930 .35s 5.7s forwards;
}

@keyframes orgEnterLeft{
  from{
    opacity:0;
    transform:translateX(-60px);
  }

  to{
    opacity:1;
    transform:translateX(0);
  }
}

@keyframes orgEnterRight{
  from{
    opacity:0;
    transform:translateX(60px);
  }

  to{
    opacity:1;
    transform:translateX(0);
  }
}

@keyframes coreAwake{
  to{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
    box-shadow:
      0 0 20px rgba(200,164,92,.35),
      0 0 60px rgba(200,164,92,.15);
  }
}

@keyframes lineGrow{
  from{
    width:0;
    opacity:0;
  }

  to{
    width:230px;
    opacity:1;
  }
}

@keyframes stamp1930{
  0%{
    opacity:0;
    transform:rotate(-5deg) scale(2.2);
  }

  70%{
    opacity:1;
    transform:rotate(-5deg) scale(.9);
  }

  100%{
    opacity:1;
    transform:rotate(-5deg) scale(1);
  }
}

@media(max-width:750px){

  .fractureScene{
    height:330px;
  }

  .orgStream{
    width:180px;
    font-size:10px;
  }

  .org1{
    top:0;
  }

  .org2{
    top:110px;
  }

  .org3{
    bottom:0;
  }

  .unityLine{
    display:none;
  }
}
  /* ===== LEVEL 3 · BOSS PHASE 1 ===== */

.boss1930{
  width:min(980px,100%);
  position:relative;
}

.bossTop{
  width:min(850px,100%);
  margin:0 auto 22px;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
}

.bossLabel{
  text-align:left;
  color:#c8a45c;
  font-size:12px;
  letter-spacing:4px;
  line-height:1.7;
}

.bossTimer{
  min-width:100px;
  padding:12px 17px;

  border:1px solid rgba(184,59,56,.55);
  border-radius:8px;

  background:rgba(184,59,56,.08);

  color:#e77b76;
  font-size:15px;
  letter-spacing:2px;

  box-shadow:0 0 20px rgba(184,59,56,.08);
}

.unityBox{
  width:min(780px,100%);
  margin:0 auto 28px;
}

.unityText{
  margin-bottom:9px;

  display:flex;
  justify-content:space-between;

  color:#9e9183;

  font-size:11px;
  letter-spacing:3px;
}

.unityTrack{
  height:8px;
  overflow:hidden;

  background:#302222;

  border:1px solid rgba(255,255,255,.04);
  border-radius:20px;
}

#unityFill{
  height:100%;
  width:25%;

  background:
    linear-gradient(
      90deg,
      #8f302e,
      #c8a45c
    );

  box-shadow:0 0 25px rgba(200,164,92,.35);

  transition:width .55s ease;
}

.crisisCard{
  width:min(820px,100%);
  margin:0 auto;

  padding:30px;

  border:1px solid rgba(200,164,92,.2);
  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.045),
      rgba(255,255,255,.012)
    );

  box-shadow:
    0 20px 70px rgba(0,0,0,.18);
}

.crisisNumber{
  margin-bottom:13px;

  color:#b83b38;

  font-size:11px;
  letter-spacing:5px;
}

.crisisQuestion{
  margin-bottom:25px;

  color:#f0e6d8;

  font-size:23px;
  line-height:1.5;
}

.choiceGrid1930{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}

.choice1930{
  appearance:none;
  -webkit-appearance:none;

  width:100%;

  padding:17px 20px;

  border:1px solid rgba(200,164,92,.2);
  border-radius:9px;

  background:rgba(0,0,0,.16);

  color:#e8ddce;

  font-family:Arial,sans-serif;
  font-size:15px;
  line-height:1.45;

  text-align:left;

  cursor:pointer;

  transition:
    transform .22s ease,
    border-color .22s ease,
    background .22s ease;
}

.choice1930:hover{
  transform:translateX(8px);

  border-color:#c8a45c;

  background:rgba(200,164,92,.08);
}

.choice1930.correct1930{
  border-color:#70a66b;

  color:#add6a8;

  background:rgba(65,110,60,.16);

  box-shadow:0 0 20px rgba(80,140,70,.12);
}

.choice1930.wrong1930{
  border-color:#b83b38;

  color:#e47a76;

  background:rgba(150,40,40,.14);

  animation:shake .35s;
}

.phaseKnowledge{
  width:min(820px,100%);
  min-height:88px;

  margin:18px auto 0;
  padding:16px 20px;

  border-left:2px solid #c8a45c;

  background:rgba(200,164,92,.04);

  color:#c8beb1;

  font-size:14px;
  line-height:1.7;

  text-align:left;
}

.phaseXP{
  color:#c8a45c;
  font-weight:bold;
  letter-spacing:1px;
}

.combo1930{
  position:fixed;

  right:35px;
  top:105px;

  z-index:50;

  color:#c8a45c;

  font-size:21px;
  font-weight:bold;
  letter-spacing:2px;

  opacity:0;

  transform:scale(.7);

  pointer-events:none;
}

.combo1930.showCombo{
  animation:comboPop .7s ease;
}

.bossDanger{
  animation:bossPulse .55s infinite alternate;
}

@keyframes comboPop{

  0%{
    opacity:0;
    transform:scale(.6);
  }

  35%{
    opacity:1;
    transform:scale(1.25);
  }

  100%{
    opacity:0;
    transform:scale(1);
  }
}

@keyframes bossPulse{

  from{
    box-shadow:0 0 5px rgba(184,59,56,.1);
  }

  to{
    box-shadow:0 0 28px rgba(184,59,56,.5);
  }
}

@media(max-width:700px){

  .bossTop{
    flex-direction:column;
    align-items:center;
  }

  .bossLabel{
    text-align:center;
  }

  .crisisQuestion{
    font-size:18px;
  }

  .crisisCard{
    padding:22px 16px;
  }

  .combo1930{
    top:90px;
    right:15px;
  }
}
</style>
</head>

<body>

<div id="game">
<div class="noise"></div>

<div id="hud">
  <div class="hudBlock">
    <span id="hearts">♥ ♥ ♥</span>
  </div>

  <div class="hudBlock">
    XP <span class="gold" id="xp">0</span>
  </div>

  <div class="hudBlock">
    LEVEL 1 / 5
    <div class="progressWrap">
      <div id="progress"></div>
    </div>
  </div>
</div>

<div id="screen" class="screen">
  <div class="content">

    <div class="small">1911 — 2026</div>

    <h1>
      HÀNH TRÌNH<br>
      <span class="red">TƯ TƯỞNG</span>
    </h1>

    <p class="subtitle">
      Một trải nghiệm tương tác qua những dấu mốc,
      lựa chọn và giá trị trong Tư tưởng Hồ Chí Minh.
      <br><br>
      Mỗi lựa chọn của bạn sẽ tạo nên hành trình.
    </p>

    <button class="btn" id="startBtn">
      BẮT ĐẦU HÀNH TRÌNH →
    </button>

  </div>
</div>

</div>

<script>

function setupLevel2(){

  const cards = document.querySelectorAll(".conceptCard");
  const slots = document.querySelectorAll(".dropSlot");

  cards.forEach(function(card){

    card.addEventListener("click",function(){

      cards.forEach(c => c.classList.remove("selected"));

      card.classList.add("selected");

      level2Selected = card;

      document.getElementById("level2Feedback").textContent =
        "Đã chọn mảnh ghép. Hãy chọn vị trí phù hợp.";

    });


    card.addEventListener("dragstart",function(e){

      e.dataTransfer.setData(
        "text/plain",
        card.dataset.match
      );

      level2Selected = card;

    });

  });


  slots.forEach(function(slot){

    slot.addEventListener("click",function(){

      if(!level2Selected){

        document.getElementById("level2Feedback").textContent =
          "Hãy chọn một mảnh ghép trước.";

        return;
      }

      checkLevel2Match(level2Selected,slot);

    });


    slot.addEventListener("dragover",function(e){
      e.preventDefault();
    });


    slot.addEventListener("drop",function(e){

      e.preventDefault();

      const match = e.dataTransfer.getData("text/plain");

      const card = [...document.querySelectorAll(".conceptCard")]
        .find(c => c.dataset.match === match);

      if(card){
        checkLevel2Match(card,slot);
      }

    });

  });
}


function checkLevel2Match(card,slot){

  if(!level2Active) return;

  if(card.dataset.match === slot.dataset.match){

    card.classList.remove("selected");

    card.classList.add("matched");

    slot.classList.add("matched");

    slot.innerHTML =
      "✓ " + slot.innerHTML;

    xp += 150;
    level2Matched++;

    updateHUD();

    document.getElementById("level2Feedback").innerHTML =
      `<span style="color:#8fb987">
      ✓ GHÉP CHÍNH XÁC &nbsp; +150 XP
      </span>`;

    level2Selected = null;

    if(level2Matched === 3){

      level2Active = false;

      clearInterval(level2Interval);

      setTimeout(level2Complete,800);

    }

  } else {

    hearts--;

    updateHUD();

    slot.classList.remove("wrong");

    void slot.offsetWidth;

    slot.classList.add("wrong");

    document.getElementById("level2Feedback").innerHTML =
      `<span style="color:#d45d58">
      ✕ Chưa đúng mối liên hệ. Hãy thử lại.
      </span>`;

    card.classList.remove("selected");

    level2Selected = null;

    if(hearts <= 0){

      clearInterval(level2Interval);

      level2Fail("BẠN ĐÃ HẾT 3 LƯỢT");

    }

  }
}

      <div
        class="phaseKnowledge"
        id="phaseKnowledge">

        ⚠ Bạn có 12 giây để đưa ra quyết định.

      </div>

    </div>
  `;


  document
    .querySelectorAll(".choice1930")
    .forEach(function(button){

      button.addEventListener(
        "click",
        function(){

          choosePhase1(
            Number(button.dataset.index),
            button
          );

        }
      );

    });


  phase1Timer =
    setInterval(function(){

      if(phase1Locked){
        return;
      }

      phase1Time--;


      const timer =
        document.getElementById("bossTime");


      if(timer){
        timer.textContent = phase1Time;
      }


      if(phase1Time <= 5){

        const timerBox =
          document.getElementById("bossTimerBox");

        if(timerBox){
          timerBox.classList.add("bossDanger");
        }

      }


      if(phase1Time <= 0){

        clearInterval(phase1Timer);

        phase1Wrong(null);

      }

    },1000);
}


function choosePhase1(index,button){

  if(phase1Locked){
    return;
  }

  phase1Locked = true;

  clearInterval(phase1Timer);


  const q =
    phase1Questions[phase1Index];


  document
    .querySelectorAll(".choice1930")
    .forEach(function(b){

      b.disabled = true;

    });


  if(index === q.correct){

    button
      .classList
      .add("correct1930");


    phase1Combo++;


    const multiplier =
      Math.min(phase1Combo,3);


    const reward =
      150 * multiplier;


    xp += reward;

    phase1Unity += 25;


    if(phase1Unity > 100){
      phase1Unity = 100;
    }


    updateHUD();


    const unityFill =
      document.getElementById("unityFill");


    const unityPercent =
      document.getElementById("unityPercent");


    if(unityFill){
      unityFill.style.width =
        phase1Unity + "%";
    }


    if(unityPercent){
      unityPercent.textContent =
        phase1Unity + "%";
    }


    showPhase1Combo(
      multiplier,
      reward
    );


    document
      .getElementById("phaseKnowledge")
      .innerHTML = `

        <span class="phaseXP">
          ✓ QUYẾT ĐỊNH CHÍNH XÁC
          · +${reward} XP
        </span>

        <br><br>

        ${q.knowledge}

      `;


    setTimeout(function(){

      phase1Index++;


      if(
        phase1Index <
        phase1Questions.length
      ){

        renderPhase1Question();

      }else{

        phase1Complete();

      }

    },3300);


  }else{

    button
      .classList
      .add("wrong1930");


    phase1Combo = 0;

    phase1Wrong(q);

  }
}


function showPhase1Combo(
  multiplier,
  reward
){

  const combo =
    document.getElementById("combo1930");


  if(!combo){
    return;
  }


  combo.textContent =
    "COMBO x" +
    multiplier +
    "  +" +
    reward +
    " XP";


  combo.classList.remove(
    "showCombo"
  );


  void combo.offsetWidth;


  combo.classList.add(
    "showCombo"
  );
}


function phase1Wrong(q){

  if(!phase1Locked){
    phase1Locked = true;
  }

  clearInterval(phase1Timer);


  hearts--;

  phase1Combo = 0;

  updateHUD();


  document
    .querySelectorAll(".choice1930")
    .forEach(function(b){

      b.disabled = true;

    });


  const knowledge =
    document.getElementById(
      "phaseKnowledge"
    );


  if(knowledge){

    knowledge.innerHTML = `

      <span style="color:#df716d">
        ✕ QUYẾT ĐỊNH KHÔNG PHÙ HỢP
      </span>

      <br><br>

      ${
        q
          ? q.knowledge
          : "Bạn đã để thời gian quyết định kết thúc. Trong một giai đoạn khủng hoảng tổ chức, việc chậm đưa ra quyết định có thể khiến sự phân tán kéo dài."
      }

    `;

  }


  if(hearts <= 0){

    setTimeout(
      phase1Fail,
      2600
    );

    return;
  }


  setTimeout(function(){

    renderPhase1Question();

  },3000);
}


function phase1Fail(){

  clearInterval(phase1Timer);


  xp = level3BaseXP;

  updateHUD();


  screen.innerHTML = `
    <div class="content">

      <div class="small">
        BOSS MISSION FAILED
      </div>

      <h1>
        KHỦNG HOẢNG<br>
        <span class="red">
          CHƯA ĐƯỢC GIẢI QUYẾT
        </span>
      </h1>

      <p class="subtitle">

        Sự phân tán vẫn còn tồn tại.

        <br><br>

        Quay lại bàn hội nghị
        và đưa ra những quyết định chính xác hơn.

      </p>

      <button
        class="btn"
        id="retryPhase1">

        THỬ LẠI PHASE 01 →

      </button>

    </div>
  `;


  document
    .getElementById("retryPhase1")
    .addEventListener(
      "click",
      startPhase1
    );
}


function phase1Complete(){

  clearInterval(phase1Timer);

  phase1Unity = 100;


  screen.innerHTML = `
    <div class="content">

      <div class="small">
        PHASE 01 COMPLETE
      </div>

      <h1>
        THỐNG NHẤT<br>
        <span class="gold">
          100%
        </span>
      </h1>

      <div class="scoreBig">
        UNITY ACHIEVED
      </div>

      <p class="subtitle">

        Yêu cầu thống nhất lực lượng lãnh đạo
        đã được giải quyết.

        <br><br>

        Nhưng một chính đảng thống nhất
        vẫn phải trả lời câu hỏi quan trọng hơn:

        <br><br>

        <strong>
          Cách mạng Việt Nam sẽ xác định
          mục tiêu, lực lượng và đường lối như thế nào?
        </strong>

      </p>

      <button
        class="btn"
        id="phase2Btn">

        MỞ PHASE 02 · GIẢI MÃ CƯƠNG LĨNH →

      </button>

    </div>
  `;


  document
    .getElementById("phase2Btn")
    .addEventListener(
      "click",
      function(){

        screen.innerHTML = `
          <div class="content">

            <div class="small">
              LEVEL 03 · PHASE 02
            </div>

            <h1>
              GIẢI MÃ<br>
              <span class="red">
                CƯƠNG LĨNH
              </span>
            </h1>

            <p class="subtitle">

              Phase 01 đã hoàn thành.

              <br><br>

              Phase 02 sẽ yêu cầu bạn
              tái cấu trúc những nội dung
              cốt lõi của Cương lĩnh đầu tiên.

            </p>

          </div>
        `;

      }
    );
}
</script>

</body>
</html>
